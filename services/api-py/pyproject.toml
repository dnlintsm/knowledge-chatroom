[project]
name = "api-py"
version = "0.2.3"
description = "The agent server's HTTP API in Python, in front of the TypeScript server while routes move over (issue #190)"
requires-python = ">=3.11"
dependencies = [
    "knowledge-chatroom",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The pass-through to the TypeScript server, streamed both ways.
    "httpx>=0.27",
    # Postgres, with the same migrations and row-level security as the TypeScript server.
    "psycopg[binary,pool]>=3.2",
    # Signing and checking identity tokens (tokens.py).
    "cryptography>=42",
    # The S3-compatible blob store, as @aws-sdk/client-s3 is for the TypeScript server.
    "boto3>=1.36",
    # POST /experiments/upload's multipart body, read part by part (uploads.py).
    "python-multipart>=0.0.20",
    # Search by meaning with the local embedding model (semantic.py): the ONNX file
    # transformers.js runs in the TypeScript server, its tokenizer, and the download.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    # Sorting as JavaScript's localeCompare does (collation.py), with CLDR's root table.
    "pyuca>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# A server run from its folder (python -m api_py.app), not a library.
package = false

[tool.uv.sources]
knowledge-chatroom = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
