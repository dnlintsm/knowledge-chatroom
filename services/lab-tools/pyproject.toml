[project]
name = "lab-tools"
version = "0.2.3"
description = "The Python agent sample's tools as an MCP server (guide: examples/python-agent)"
requires-python = ">=3.12"
dependencies = [
    "knowledge-chatroom",
    # The MCP server (lab_tools/server.py). mcp 2 renamed FastMCP to MCPServer.
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# A server run from its folder (python -m lab_tools.server), not a library.
package = false

[tool.uv.sources]
knowledge-chatroom = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
