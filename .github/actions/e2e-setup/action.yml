name: E2E setup
description: Node, pnpm, the locked install, Playwright Chromium and the production build, as each E2E job in ui-preview.yml needs them.

inputs:
  python:
    description: Also install uv and the Python services (api-py, agent-py).
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    # pnpm at the version in package.json "packageManager".
    - name: Enable pnpm
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Build app
      shell: bash
      run: pnpm build

    - uses: actions/setup-python@v5
      if: inputs.python == 'true'
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      if: inputs.python == 'true'
      with:
        version: "0.11.32"
        enable-cache: true
        # The one lockfile of the uv workspace. The default glob searches the whole
        # checkout, node_modules included, which took 20-70 s here (issue #219).
        cache-dependency-glob: uv.lock
    - name: Install the Python services
      if: inputs.python == 'true'
      shell: bash
      run: uv sync --all-packages --locked
