# Builds the app on every PR, runs the E2E suites, and posts screenshots + a
# walkthrough GIF in a sticky PR comment, so reviewers can see the UI without
# running `pnpm dev`. Full-resolution videos and the Playwright reports are
# attached to the run as artifacts, one per suite job.
#
# Images are stored on the `ui-previews` branch (pr-<number>/<sha>/) so the
# comment can show them inline; a PR's folder is removed when it closes.
#
# Each suite runs only when the change can affect it (scripts/ci-changes.mjs,
# issue #192): a change to services/api-py runs the storage and login suites but
# not the walkthrough. The suites run in parallel jobs, each on its own runner
# (its own database, S3, ports and output folders), and `preview`, the required
# check, waits only for them. The GIF, the image upload and the PR comment run
# afterwards in `publish`, which `preview` does not wait for (issue #219).
name: UI preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: ui-previews
  COMMENT_MARKER: "<!-- ui-preview -->"
  ARTIFACT_PREFIX: ui-preview-${{ github.event.pull_request.number || github.run_id }}

jobs:
  # Which suites this change can affect.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.affected.outputs.browser }}
      storage: ${{ steps.affected.outputs.storage }}
      pyagent: ${{ steps.affected.outputs.pyagent }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its base parent, for the PR's diff.
          fetch-depth: 2
      - name: Find the affected suites
        id: affected
        run: node scripts/ci-changes.mjs

  # The walkthrough and the other browser specs, against the mock agent. No
  # server storage: browser mode clears DATABASE_URL (playwright.config.ts).
  e2e-browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1 # gate test: the job times out, which GitHub reports as cancelled
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      COPILOTKIT_TELEMETRY_DISABLED: true
    outputs:
      browser: ${{ steps.browser.outcome }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate test, outlive the job timeout
        run: sleep 300
      - uses: ./.github/actions/e2e-setup

      - name: Capture UI preview
        id: browser
        run: node scripts/ci-tests.mjs run "Browser E2E" playwright -- pnpm test:e2e --reporter=list,html,json

      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Browser E2E"

      - name: Upload preview artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-browser
          path: |
            preview/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Server storage and the knowledge tree, then login and sharing, with api-py in
  # front of the agent server (issue #190). They share this job's database and S3
  # in sequence, as before; login gets its own output folder.
  e2e-storage:
    needs: changes
    if: false # gate test: storage needed but skipped
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://knowledge:knowledge@localhost:5432/knowledge
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: knowledge
      S3_SECRET_ACCESS_KEY: knowledge-secret
      S3_PUBLIC_URL: http://localhost:8333
      NEXT_TELEMETRY_DISABLED: 1
      COPILOTKIT_TELEMETRY_DISABLED: true
    outputs:
      storage: ${{ steps.storage.outcome }}
      login: ${{ steps.login.outcome }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          docker logs s3
          exit 1

      - uses: ./.github/actions/e2e-setup
        with:
          python: "true"

      - name: Test server storage and knowledge tree
        id: storage
        run: node scripts/ci-tests.mjs run "Storage E2E" playwright -- pnpm test:e2e:storage --output test-results-storage --reporter=list,json

      # Login and sharing need the app with login on, so they get their own run
      # (and their own output folder).
      - name: Capture login and sharing
        id: login
        if: always() && steps.storage.outcome != 'skipped'
        run: node scripts/ci-tests.mjs run "Login E2E" playwright -- pnpm test:e2e:login --output test-results-login --reporter=list,json

      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Storage E2E" "Login E2E"

      - name: Upload preview artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-storage
          path: |
            preview/
            test-results-storage/
            test-results-login/
          retention-days: 14
          if-no-files-found: ignore

  # The chat on the Python agent (services/agent-py, issue #176): a real Claude
  # Code engine with a scripted model, so it needs no API key, and no storage.
  e2e-python:
    needs: changes
    if: needs.changes.outputs.pyagent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      COPILOTKIT_TELEMETRY_DISABLED: true
    outputs:
      pyagent: ${{ steps.python.outcome }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
        with:
          python: "true"

      - name: Gate test, fail before the suite
        run: exit 1
      - name: Test the chat on the Python agent
        id: python
        run: node scripts/ci-tests.mjs run "Python agent E2E" playwright -- pnpm test:e2e:python --output test-results-python --reporter=list,json

      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Python agent E2E"

      - name: Upload preview artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-python
          path: |
            test-results-python/
          retention-days: 14
          if-no-files-found: ignore

  # The required check: always reports, and passes only when each suite this
  # change can affect passed, and each one it cannot affect was skipped.
  preview:
    if: ${{ always() && github.event.action != 'closed' }}
    needs: [changes, e2e-browser, e2e-storage, e2e-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the affected E2E suites
        env:
          CHANGES: ${{ needs.changes.result }}
          WANT_BROWSER: ${{ needs.changes.outputs.browser }}
          WANT_STORAGE: ${{ needs.changes.outputs.storage }}
          WANT_PYAGENT: ${{ needs.changes.outputs.pyagent }}
          GOT_BROWSER: ${{ needs.e2e-browser.result }}
          GOT_STORAGE: ${{ needs.e2e-storage.result }}
          GOT_PYAGENT: ${{ needs.e2e-python.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Could not decide which suites to run (changes: $CHANGES)."; exit 1
          fi
          failed=0
          check() { # job, wanted, result
            if [ "$2" = true ]; then expected=success; else expected=skipped; fi
            if [ "$3" = "$expected" ]; then
              echo "$1: $3, as expected."
            else
              echo "::error::$1: expected $expected, got $3."; failed=1
            fi
          }
          check e2e-browser "$WANT_BROWSER" "$GOT_BROWSER"
          check e2e-storage "$WANT_STORAGE" "$GOT_STORAGE"
          check e2e-python "$WANT_PYAGENT" "$GOT_PYAGENT"
          exit $failed

  # Not required, and `preview` does not wait for it: the walkthrough GIF, the
  # images on the ui-previews branch and the sticky PR comment. It runs no code
  # from the PR: the suite artifacts are data, and the GIF script comes from the
  # base branch. Forks get a read-only token, so they only get the artifacts.
  publish:
    needs: [changes, e2e-browser, e2e-storage, e2e-python]
    # !cancelled(), not always(): a run superseded by a newer push must not
    # overwrite the newer run's images and comment.
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.result == 'success'
      && (needs.changes.outputs.browser == 'true' || needs.changes.outputs.storage == 'true' || needs.changes.outputs.pyagent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push images to the ui-previews branch
      pull-requests: write # sticky preview comment
    steps:
      - name: Download the suite artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          path: artifacts

      - name: Collect the screenshots
        run: |
          mkdir -p preview
          for dir in artifacts/*/preview; do
            [ -d "$dir" ] && cp -r "$dir"/. preview/
          done
          ls -R preview | head -50

      # The base branch's script, not the PR's: this job has a write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: scripts/preview-gif.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Make walkthrough GIF
        if: needs.changes.outputs.browser == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          out="$PWD/preview/walkthrough.gif"
          cd "artifacts/$ARTIFACT_PREFIX-browser"
          bash "$GITHUB_WORKSPACE/base/scripts/preview-gif.sh" "$out"

      - name: Publish images to ${{ env.PREVIEW_BRANCH }}
        id: publish
        if: hashFiles('preview/**') != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          src="$PWD/preview"
          dir="pr-$PR/$SHA"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Other PRs push to the same branch, so retry on a lost race.
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin "$PREVIEW_BRANCH"; then
              git checkout -q -B "$PREVIEW_BRANCH" FETCH_HEAD
            else
              git checkout -q --orphan "$PREVIEW_BRANCH"
              git rm -rfq . 2>/dev/null || true
              printf '# UI previews\n\nScreenshots published by .github/workflows/ui-preview.yml. Safe to delete.\n' > README.md
            fi
            rm -rf "pr-$PR" # keep only the latest commit's images per PR
            mkdir -p "$dir"
            cp -r "$src"/. "$dir"/
            git add -A
            git commit -qm "Preview for PR #$PR at ${SHA:0:7}" || true
            if git push -q origin "$PREVIEW_BRANCH"; then break; fi
            sleep $((attempt * 2))
          done
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/$PREVIEW_BRANCH/$dir" >> "$GITHUB_OUTPUT"

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          IMAGE_BASE: ${{ steps.publish.outputs.base }}
          RUN_BROWSER: ${{ needs.changes.outputs.browser }}
          RUN_STORAGE: ${{ needs.changes.outputs.storage }}
          RUN_PYAGENT: ${{ needs.changes.outputs.pyagent }}
          # Each suite's step outcome, and its job's result for a suite that never
          # ran (the job was cancelled, failed during setup, or was skipped).
          OUTCOME_BROWSER: ${{ needs.e2e-browser.outputs.browser }}
          OUTCOME_STORAGE: ${{ needs.e2e-storage.outputs.storage }}
          OUTCOME_LOGIN: ${{ needs.e2e-storage.outputs.login }}
          OUTCOME_PYAGENT: ${{ needs.e2e-python.outputs.pyagent }}
          JOB_BROWSER: ${{ needs.e2e-browser.result }}
          JOB_STORAGE: ${{ needs.e2e-storage.result }}
          JOB_PYAGENT: ${{ needs.e2e-python.result }}
          ARTIFACT_BROWSER: ${{ needs.e2e-browser.outputs.artifact }}
          ARTIFACT_STORAGE: ${{ needs.e2e-storage.outputs.artifact }}
          ARTIFACT_PYAGENT: ${{ needs.e2e-python.outputs.artifact }}
        with:
          script: |
            const fs = require("fs");
            const { IMAGE_BASE: base, COMMENT_MARKER: marker } = process.env;
            const env = process.env;
            // [suite, outcome, whether this change needs it]
            const result = (step, job) => (!step || step === "skipped" ? job : step);
            const suites = [
              ["Browser E2E", result(env.OUTCOME_BROWSER, env.JOB_BROWSER), env.RUN_BROWSER === "true"],
              ["Storage E2E", result(env.OUTCOME_STORAGE, env.JOB_STORAGE), env.RUN_STORAGE === "true"],
              ["Login E2E", result(env.OUTCOME_LOGIN, env.JOB_STORAGE), env.RUN_STORAGE === "true"],
              ["Python agent E2E", result(env.OUTCOME_PYAGENT, env.JOB_PYAGENT), env.RUN_PYAGENT === "true"],
            ];
            const outcome = suites.every(([, o, needed]) => (needed ? o === "success" : o === "skipped")) ? "success" : "failure";
            const skipped = suites.filter(([, , needed]) => !needed).map(([name]) => name);
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shots = fs.existsSync("preview/screenshots")
              ? fs.readdirSync("preview/screenshots").filter((f) => f.endsWith(".png")).sort()
              : [];
            const title = (f) => f.replace(/^\d+-/, "").replace(/\.png$/, "").replace(/-/g, " ");

            const lines = [marker, `## UI preview for ${sha}`, ""];
            if (outcome !== "success") {
              const bad = suites.filter(([, o, needed]) => needed && o !== "success").map(([name, o]) => `${name} (${o || "not run"})`);
              lines.push(`> [!WARNING]`, `> Not every E2E suite passed: ${bad.join(", ")}. Images below may be partial. See the [run log](${runUrl}).`, "");
            }
            lines.push("_Agent: deterministic mock; live provider smoke tests run separately._", "");
            if (skipped.length) {
              lines.push(`_Not run, because this change cannot affect them: ${skipped.join(", ")}._`, "");
            }
            if (base && fs.existsSync("preview/walkthrough.gif")) {
              lines.push("### Walkthrough", "", `<img src="${base}/walkthrough.gif" width="720" alt="walkthrough">`, "");
            }
            if (base && shots.length) {
              lines.push("### Screenshots", "");
              for (const f of shots) {
                lines.push(`<details${f.startsWith("01") ? " open" : ""}><summary>${title(f)}</summary>`, "", `<img src="${base}/screenshots/${f}" width="720" alt="${title(f)}">`, "", "</details>");
              }
              lines.push("");
            }
            const artifacts = [
              ["browser", env.ARTIFACT_BROWSER],
              ["storage and login", env.ARTIFACT_STORAGE],
              ["Python agent", env.ARTIFACT_PYAGENT],
            ].filter(([, url]) => url).map(([name, url]) => `[${name}](${url})`);
            lines.push(`Full-size videos and the Playwright reports: ${artifacts.length ? artifacts.join(", ") : `[workflow run](${runUrl})`}.`);
            const body = lines.join("\n");

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # remove images from the ui-previews branch
    steps:
      - name: Remove this PR's images from ${{ env.PREVIEW_BRANCH }}
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth 1 origin "$PREVIEW_BRANCH" || exit 0
            git checkout -q -B "$PREVIEW_BRANCH" FETCH_HEAD
            [ -d "pr-$PR" ] || exit 0
            git rm -rq "pr-$PR"
            git commit -qm "Remove previews for closed PR #$PR"
            if git push -q origin "$PREVIEW_BRANCH"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
