name: Docker

# Builds the demo images so the Dockerfiles keep up with the code they package.
#
# Each image builds only when the change can affect it (scripts/docker-changes.mjs,
# issue #218): a change to apps/web builds the UI image, one to services/api-py
# the API server image. A path the script has no rule for builds every image.
# This workflow is not a required check; skipped builds just show as skipped.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which images this change can affect.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.affected.outputs.images }}
      compose: ${{ steps.affected.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its base parent, for the PR's diff.
          fetch-depth: 2
      - name: Find the affected images
        id: affected
        run: node scripts/docker-changes.mjs

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose file
        run: docker compose --profile demo --profile python-agent --profile python-sample --profile papers config --quiet

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    name: build (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.image }} image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            app | agent) docker build --target "$IMAGE" -t "knowledge-chatroom-$IMAGE" . ;;
            *) docker build -f "services/$IMAGE/Dockerfile" -t "knowledge-chatroom-$IMAGE" . ;;
          esac
