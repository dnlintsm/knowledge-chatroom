# Runs the storage integration tests (apps/agent/src/storage) against real Postgres
# and SeaweedFS whenever the storage code changes.
name: Storage tests

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "uv.lock"
      - "scripts/ci-*.mjs"
      - "docker-compose.yml"
      - "infra/**"
      - ".github/workflows/storage.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Postgres with pgvector, as in docker-compose.yml, for search by meaning.
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://knowledge:knowledge@localhost:5432/knowledge_test
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: knowledge
      S3_SECRET_ACCESS_KEY: knowledge-secret
      # Also check the real embedding model (embeddings.test.ts), cached below.
      EMBEDDING_TEST: 1
    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 2
          done
          docker logs s3
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # pnpm at the version in package.json "packageManager".
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/knowledge-chatroom/models
          key: embedding-model-multilingual-e5-small-q8

      - name: Install agent and contracts dependencies
        run: pnpm install --frozen-lockfile --filter ./apps/agent... --filter ./packages/contracts

      - name: Typecheck
        run: pnpm -C apps/agent typecheck

      - name: Test
        run: node scripts/ci-tests.mjs run "Storage integration" tap -- pnpm -C apps/agent test:integration
      # The agent's HTTP answers against packages/contracts/openapi/storage.yaml (issue #169).
      - name: Storage API conformance
        if: always()
        env:
          # Every request and answer that matched the spec, for the Python models below.
          CONFORMANCE_SAMPLES: ${{ runner.temp }}/api-samples.jsonl
        run: node scripts/ci-tests.mjs run "Storage API conformance" tap -- pnpm -C apps/agent test:conformance
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      # The generated pydantic models (packages/knowledge-py) parse that real traffic.
      - name: Python models parse the agent's traffic
        working-directory: packages/knowledge-py
        env:
          API_SAMPLES: ${{ runner.temp }}/api-samples.jsonl
        run: uv run --locked pytest -q tests/test_api.py
      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Storage integration" "Storage API conformance"
