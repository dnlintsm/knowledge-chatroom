name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # pnpm at the version in package.json "packageManager".
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check lint and frontend/agent types
        run: pnpm lint && pnpm typecheck
      - name: Frontend unit tests
        run: node scripts/ci-tests.mjs run "Frontend units" playwright -- pnpm exec playwright test --config playwright.unit.config.ts --reporter=list,json
      - name: Agent unit tests
        if: always()
        run: node scripts/ci-tests.mjs run "Agent units" tap -- pnpm -C agent test:unit
      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Frontend units" "Agent units"
      - name: Verify the lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

  python-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/python-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the sample's dependencies
        run: pip install -r requirements-dev.txt
      - name: Sample Python agent tests
        run: python -m pytest -q

  papers-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/papers-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server's dependencies
        run: pip install -r requirements-dev.txt
      - name: Paper search server tests
        run: python -m pytest -q
