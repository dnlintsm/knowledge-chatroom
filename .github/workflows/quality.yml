name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend and agent types and unit tests
        run: npm run check
      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- package-lock.json agent/package-lock.json
