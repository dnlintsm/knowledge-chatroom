name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check lint and frontend/agent types
        run: npm run lint && npm run typecheck
      - name: Frontend unit tests
        run: node scripts/ci-tests.mjs run "Frontend units" playwright -- npx playwright test --config playwright.unit.config.ts --reporter=list,json
      - name: Agent unit tests
        if: always()
        run: node scripts/ci-tests.mjs run "Agent units" tap -- npm --prefix agent run test:unit
      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Frontend units" "Agent units"
      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- package-lock.json agent/package-lock.json

  python-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/python-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the sample's dependencies
        run: pip install -r requirements-dev.txt
      - name: Sample Python agent tests
        run: python -m pytest -q
