name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites this change can affect (scripts/ci-changes.mjs, issue #192).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.affected.outputs.node }}
      python: ${{ steps.affected.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its base parent, for the PR's diff.
          fetch-depth: 2
      - name: Find the affected suites
        id: affected
        run: node scripts/ci-changes.mjs

  node:
    name: node checks
    needs: changes
    if: false # gate test: the Node checks are needed but skipped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # pnpm at the version in package.json "packageManager".
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check lint and types (root, web, agent, contracts)
        run: pnpm lint && pnpm typecheck
      # packages/contracts/openapi/storage.yaml is the source of truth (issue #169).
      - name: Check the generated storage API types are up to date
        run: pnpm -C packages/contracts openapi:check
      - name: Frontend unit tests
        run: node scripts/ci-tests.mjs run "Frontend units" playwright -- pnpm exec playwright test --config playwright.unit.config.ts --reporter=list,json
      - name: Agent unit tests
        if: always()
        run: node scripts/ci-tests.mjs run "Agent units" tap -- pnpm -C apps/agent test:unit
      - name: Summarize test suites
        if: always()
        run: node scripts/ci-tests.mjs summary "Frontend units" "Agent units"
      - name: Verify the lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      # Override .python-version so uv uses the matrix interpreter throughout.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      # --locked also fails when uv.lock is out of date with the pyproject files.
      - name: Install the uv workspace (services/, packages/knowledge-py)
        run: uv sync --all-packages --locked
      - name: Python lint and format
        if: matrix.python == '3.12'
        run: |
          uv run --locked --no-sync ruff check packages/knowledge-py services examples/python-agent
          uv run --locked --no-sync ruff format --check packages/knowledge-py services examples/python-agent
      - name: Python type check
        if: matrix.python == '3.12'
        run: uv run --locked --no-sync pyrefly check --error-stale-baseline
      # src/knowledge_chatroom/api.py must match packages/contracts/openapi/storage.yaml.
      - name: Python models match the OpenAPI spec
        if: matrix.python == '3.12'
        working-directory: packages/knowledge-py
        run: uv run --locked datamodel-codegen --check
      - name: Python tests
        id: python_tests
        run: |
          status=0
          coverage_sources="$GITHUB_WORKSPACE/packages/knowledge-py/src/knowledge_chatroom,$GITHUB_WORKSPACE/services/agent-py/agent_py,$GITHUB_WORKSPACE/services/api-py/api_py,$GITHUB_WORKSPACE/services/lab-tools/lab_tools,$GITHUB_WORKSPACE/services/papers-mcp/papers_mcp"
          for project in packages/knowledge-py services/*/; do
            echo "::group::$project"
            if [[ "${{ matrix.python }}" == "3.12" ]]; then
              (cd "$project" && uv run --locked --no-sync coverage run \
                --rcfile="$GITHUB_WORKSPACE/pyproject.toml" \
                --data-file="$GITHUB_WORKSPACE/.coverage" --source="$coverage_sources" \
                --append -m pytest -q) || status=1
            else
              (cd "$project" && uv run --locked pytest -q) || status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - name: Python coverage report
        if: ${{ !cancelled() && matrix.python == '3.12' && steps.python_tests.outcome != 'skipped' }}
        run: |
          uv run --locked --no-sync coverage report
          uv run --locked --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # The required checks: stable names that always report. Each passes only when
  # its suite passed, or was skipped because the change cannot affect it.
  checks:
    if: ${{ always() }}
    needs: [changes, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Node checks
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.node }}
          RESULT: ${{ needs.node.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Could not decide which suites to run (changes: $CHANGES)."; exit 1
          fi
          if [ "$WANTED" = true ]; then expected=success; else expected=skipped; fi
          if [ "$RESULT" != "$expected" ]; then
            echo "::error::Expected $expected, got $RESULT."; exit 1
          fi
          echo "Result $RESULT, as expected."

  python-required:
    # Stable required-check name covering every Python matrix leg.
    name: python
    if: ${{ always() }}
    needs: [changes, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Python checks
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.python }}
          RESULT: ${{ needs.python.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::Could not decide which suites to run (changes: $CHANGES)."; exit 1
          fi
          if [ "$WANTED" = true ]; then expected=success; else expected=skipped; fi
          if [ "$RESULT" != "$expected" ]; then
            echo "::error::Expected $expected, got $RESULT."; exit 1
          fi
          echo "Result $RESULT, as expected."
