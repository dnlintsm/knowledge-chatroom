# One pnpm workspace for the TypeScript side (issue #164). Python lives in its own
# uv workspace.
packages:
  - apps/*
  - packages/*

# Install scripts run only for the packages listed true.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true

# Patched transitive versions (docs/development.md, "Dependency security").
overrides:
  body-parser: 2.4.0
  follow-redirects: 1.16.2
  graphql-scalars: 2.0.1
  katex: 0.18.11
  sharp: 0.35.5
  undici: 6.29.1
