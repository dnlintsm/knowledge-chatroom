# Storage for the workspace: Postgres (metadata, versions, search, with pgvector
# for search by meaning) and SeaweedFS as a self-hosted S3-compatible object store.
#
#   docker compose up -d
#
# then set the DATABASE_URL / S3_* values from .env.example and run `npm run dev`.
#
# The whole demo (storage, agent and UI) in one command, with ANTHROPIC_API_KEY
# in .env, then open http://localhost:3000:
#
#   docker compose --profile demo up --build
# To use managed services instead (RDS/Neon, AWS S3, R2, B2), skip this file and
# point the same env vars at them.
#
# The S3 credentials below are local development defaults; change them in
# deploy/seaweedfs/s3.json and .env before exposing anything.

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Demo profile: the agent and UI built from ./Dockerfile ---
  # No login (one built-in user owns everything); chat needs ANTHROPIC_API_KEY.
  agent:
    profiles: [demo]
    build:
      context: .
      target: agent
    environment:
      # The demo runs without login; production images refuse to guess.
      AUTH_MODE: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      SUGGESTIONS_MODEL: ${SUGGESTIONS_MODEL:-}
      # Outside MCP servers (JSON); use service names, not localhost, for URLs.
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Personalized memory (experimental): MEMORY=on turns it on (.env.example).
      MEMORY: ${MEMORY:-}
      MEMORY_MODEL: ${MEMORY_MODEL:-}
      MEMORY_LEARN: ${MEMORY_LEARN:-}
      MEMORY_IDLE_MINUTES: ${MEMORY_IDLE_MINUTES:-10}
      # Point at an Anthropic-compatible gateway (OpenRouter, LiteLLM) instead.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      DATABASE_URL: postgres://knowledge:knowledge@postgres:5432/knowledge
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: knowledge
      S3_ACCESS_KEY_ID: knowledge
      S3_SECRET_ACCESS_KEY: knowledge-secret
      S3_FORCE_PATH_STYLE: "true"
      # Binary downloads go straight to the store, as the browser reaches it.
      S3_PUBLIC_URL: http://localhost:8333
      # Search by meaning through an embeddings API instead of the local model
      # (.env.example). Empty keeps the local model.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-}
    volumes:
      - models:/var/lib/knowledge/models
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    # The agent port stays private: the UI forwards to it and signs identities.

  app:
    profiles: [demo]
    build:
      context: .
      target: app
    environment:
      LOCAL_AGENT_URL: http://agent:8000
      # A remote backend for the chat (docs/remote-agent.md); empty = the agent above.
      AGENT_URL: ${AGENT_URL:-}
      AUTH_MODE: local
      CHAT_SUGGESTIONS: ${CHAT_SUGGESTIONS:-}
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy

  # --- Sample Python tools (examples/python-agent) for the demo's agent ---
  # Add `--profile python-sample` and, in .env,
  # MCP_SERVERS={"mcpServers":{"lab":{"url":"http://lab-tools:9100/mcp","forwardIdentity":true,"storageAccess":true,"memoryAccess":true}}}
  lab-tools:
    profiles: [python-sample]
    build: ./examples/python-agent
    environment:
      LAB_TOOLS_NAME: lab
      # Workspace files, read through the storage API as the calling user.
      KNOWLEDGE_STORAGE_URL: http://agent:8000
      # The demo has no login, so every call is the local user. With login, give
      # this server the agent's public key, never AUTH_SECRET
      # (examples/python-agent/README.md).
      KNOWLEDGE_PUBLIC_KEY: ""

volumes:
  postgres-data:
  s3-data:
  models:
