# Storage for the workspace: Postgres (metadata, versions, search, with pgvector
# for search by meaning) and SeaweedFS as a self-hosted S3-compatible object store.
#
#   docker compose up -d
#
# then set the DATABASE_URL / S3_* values from .env.example and run `npm run dev`.
#
# The whole demo (storage, agent and UI) in one command, with ANTHROPIC_API_KEY
# in .env, then open http://localhost:3000:
#
#   docker compose --profile demo up --build
# To use managed services instead (RDS/Neon, AWS S3, R2, B2), skip this file and
# point the same env vars at them.
#
# The S3 credentials below are local development defaults; change them in
# infra/seaweedfs/s3.json and .env before exposing anything.

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The Python HTTP API: storage, skills, memory and every route but the chat.
  api:
    profiles: [demo]
    build:
      context: .
      dockerfile: services/api-py/Dockerfile
    environment:
      AUTH_MODE: local
      DATABASE_URL: postgres://knowledge:knowledge@postgres:5432/knowledge
      # The same store as the agent: api-py serves /files (issue #190, step 3).
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: knowledge
      S3_ACCESS_KEY_ID: knowledge
      S3_SECRET_ACCESS_KEY: knowledge-secret
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: http://localhost:8333
      # Search and its indexer (issue #190, step 5): the same model settings as the agent.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-}
      # The chat's "+" menu (issue #190, step 7b): the same outside MCP servers as the agent.
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Each user's memory notes (step 8): on where the agent has it on.
      MEMORY: ${MEMORY:-}
      # Importing plain-text memory asks the same small model as the agent (step 8c).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      SUGGESTIONS_MODEL: ${SUGGESTIONS_MODEL:-}
      MEMORY_MODEL: ${MEMORY_MODEL:-}
      # It learns from quiet chats too, in the agent's place (step 8d).
      MEMORY_LEARN: ${MEMORY_LEARN:-}
      MEMORY_IDLE_MINUTES: ${MEMORY_IDLE_MINUTES:-10}
    volumes:
      - api-models:/var/lib/knowledge/models
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Private like the agent port: the UI forwards to it and signs identities.

  app:
    profiles: [demo]
    build:
      context: .
      target: app
    environment:
      LOCAL_AGENT_URL: http://api:8000
      # Chat uses the Python agent by default; AGENT_URL can select another backend.
      AGENT_URL: ${AGENT_URL:-http://agent-py:9300}
      AUTH_MODE: local
      CHAT_SUGGESTIONS: ${CHAT_SUGGESTIONS:-}
      CHAT_STEPS: ${CHAT_STEPS:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      agent-py:
        condition: service_healthy

  # --- The chat on the Python agent (services/agent-py, issue #176) ---
  # With the demo, and the app's chat pointed at it (docs/remote-agent.md):
  #   AGENT_URL=http://agent-py:9300 docker compose --profile demo --profile python-agent up --build
  # It reaches storage, skills and memory through the api service above, and gets
  # the same model settings and MCP_SERVERS.
  agent-py:
    profiles: [demo, python-agent]
    build:
      context: .
      dockerfile: services/agent-py/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CHAT_MODELS: ${CHAT_MODELS:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      CLAUDE_CODE_MAX_CONTEXT_TOKENS:
      CLAUDE_CODE_AUTO_COMPACT_WINDOW:
      CLAUDE_AUTOCOMPACT_PCT_OVERRIDE:
      MCP_SERVERS: ${MCP_SERVERS:-}
      LOCAL_AGENT_URL: http://api:8000
      # The demo has no login, and says so: without AUTH_MODE the agent won't
      # start. With login, AUTH_MODE: oidc and the API server's public key
      # (GET /identity/public-key), never AUTH_SECRET.
      AUTH_MODE: local
      KNOWLEDGE_PUBLIC_KEY: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9300/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Like the agent port, it stays private: only the app calls it.

  # --- Sample Python tools (services/lab-tools, from examples/python-agent) ---
  # Add `--profile python-sample` and, in .env,
  # MCP_SERVERS={"mcpServers":{"lab":{"url":"http://lab-tools:9100/mcp","forwardIdentity":true,"storageAccess":true,"memoryAccess":true}}}
  lab-tools:
    profiles: [python-sample]
    build:
      context: .
      dockerfile: services/lab-tools/Dockerfile
    environment:
      LAB_TOOLS_NAME: lab
      # Workspace files, read through the storage API as the calling user.
      KNOWLEDGE_STORAGE_URL: http://api:8000
      # The demo has no login, so every call is the local user. With login,
      # AUTH_MODE: oidc and the API server's public key, never AUTH_SECRET
      # (examples/python-agent/README.md).
      AUTH_MODE: local
      KNOWLEDGE_PUBLIC_KEY: ""

  # --- Paper search (services/papers-mcp, issue #151) ---
  # Add `--profile papers` and, in .env,
  # MCP_SERVERS={"mcpServers":{"papers":{"url":"http://papers:9200/mcp","forwardIdentity":true,"storageAccess":true,"ui":{"label":"Search papers","chip":"Papers","icon":"book-open","tools":["search_papers","get_paper","save_paper"]}}}}
  papers:
    profiles: [papers]
    build:
      context: .
      dockerfile: services/papers-mcp/Dockerfile
    environment:
      PAPERS_NAME: papers
      # save_paper writes through the storage API as the calling user.
      KNOWLEDGE_STORAGE_URL: http://api:8000
      # The demo has no login, so every call is the local user. With login,
      # AUTH_MODE: oidc and the API server's public key, never AUTH_SECRET.
      AUTH_MODE: local
      KNOWLEDGE_PUBLIC_KEY: ""
      # Optional: a bigger OpenAlex budget, and the "polite pool".
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}

volumes:
  postgres-data:
  s3-data:
  api-models:
