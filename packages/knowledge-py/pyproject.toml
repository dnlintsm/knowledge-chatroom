[project]
name = "knowledge-chatroom"
version = "0.2.3"
description = "Identity, storage and memory clients shared by the chatroom's Python services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Checks the chatroom's Ed25519-signed identity tokens (identity.py).
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
