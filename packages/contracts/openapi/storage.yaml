    delete:
      tags: [access]
      operationId: removeGroupMember
      summary: Remove a member (workspace owners)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /access/grants:
    get:
      tags: [access]
      operationId: listGrants
      summary: Grants on a node, or on the workspace (owners of that place)
      parameters:
        - name: node
          in: query
          description: A node id; leave it out for the workspace's grants.
          schema: { type: string }
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [access]
      operationId: setGrant
      summary: Give a user or group a role on a node or the workspace (owners of that place)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node, principalType, principalId, role]
              properties:
                node: { type: [string, "null"], description: null for the whole workspace. }
                principalType: { type: string, enum: [user, group] }
                principalId: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The grant's id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdOnly" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /access/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [access]
      operationId: revokeGrant
      summary: Remove a grant (owners of its place)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /access/audit:
    get:
      tags: [access]
      operationId: getAuditLog
      summary: Recent changes, newest first (workspace owners)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: kind
          in: query
          description: Keep only these kinds of action, such as `group` or `grant` (repeatable).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  # --- The rest of the agent server (issue #169, step 3) ---

  /health:
    get:
      tags: [server]
      operationId: getHealth
      summary: The server is up
      security: [{}]
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /identity/public-key:
    get:
      tags: [server]
      operationId: getIdentityPublicKey
      summary: The Ed25519 key that verifies identity and storage tokens
      description: |
        Outside services (MCP servers, a remote agent backend) verify `X-Knowledge-User` and
        `X-Knowledge-Storage` tokens with this key instead of AUTH_SECRET (docs/remote-agent.md).
      security: [{}]
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                type: object
                required: [alg, key]
                properties:
                  alg: { type: string, const: Ed25519 }
                  key: { type: string, description: The raw public key, base64url. }
        "404":
          description: Login is off, so there are no identity tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /suggest:
    post:
      tags: [server]
      operationId: suggestFollowUps
      summary: Follow-up chips for the chat
      description: |
        One Messages API call on a small model that answers CopilotKit's forced
        `copilotkitSuggest` tool call (apps/agent/src/suggest.ts). The body is an AG-UI
        RunAgentInput whose `tools` include `copilotkitSuggest`; the answer is an AG-UI event
        stream: RUN_STARTED, then the tool call (TOOL_CALL_START, TOOL_CALL_ARGS,
        TOOL_CALL_END) and RUN_FINISHED, or RUN_ERROR with the reason. Nothing is stored.
        The events come as Server-Sent Events for `Accept: text/event-stream` (what the app
        sends), and as AG-UI protobuf otherwise, as the AG-UI encoder picks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunAgentInput" }
      responses:
        "200":
          description: AG-UI events.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Lines of `data: <AG-UI event JSON>` separated by blank lines."
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
            application/vnd.ag-ui.event+proto:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404":
          description: Chat is served by a remote backend (AGENT_URL), which answers this instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tools:
    get:
      tags: [tools]
      operationId: listTools
      summary: The chat's "+" menu of outside tools
      description: The MCP servers in MCP_SERVERS that have a `ui` block (apps/agent/src/tools-api.ts).
      responses:
        "200":
          description: The menu.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items: { $ref: "#/components/schemas/ToolMenuItem" }
        "401": { $ref: "#/components/responses/SignIn" }

  /tools/{server}/{tool}:
    parameters:
      - name: server
        in: path
        required: true
        schema: { type: string }
      - name: tool
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tools]
      operationId: callTool
      summary: Call one of a menu server's tools as the signed-in user
      description: Only the tools in that server's `ui.tools` (its `callable` list in the menu).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arguments]
              properties:
                arguments: { type: object, additionalProperties: true }
      responses:
        "200":
          description: What the tool answered.
          content:
            application/json:
              schema:
                type: object
                required: [result, text]
                properties:
                  result:
                    description: Its structured content, or the JSON in its text, or null.
                  text: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403":
          description: The tool isn't one the app may call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such server in the menu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The tool ran and reported an error (the reason is in `error`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The server couldn't be reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: Every skill you can use, with the mode that applies
      description: |
        Works without storage too: then only the built-in skills, for the local user, with
        modes kept until the server restarts.
      parameters:
        - name: thread
          in: query
          description: Include this chat's modes (`chatMode`).
          schema: { type: string }
      responses:
        "200":
          description: The skills.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillList" }
        "401": { $ref: "#/components/responses/SignIn" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /skills/import:
    post:
      tags: [skills]
      operationId: importSkill
      summary: Add a skill from a .zip to the workspace's skills/ (editors)
      parameters:
        - name: filename
          in: query
          description: The .zip's file name, to name the skill when the .zip has no folder.
          schema: { type: string }
        - name: replace
          in: query
          description: "`1` or `true` replaces a skill folder of that name."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [name, path, files]
                properties:
                  name: { type: string }
                  path: { type: string, description: Its SKILL.md in the workspace. }
                  files: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /skills/{name}:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    put:
      tags: [skills]
      operationId: setSkillMode
      summary: Set (or clear, with null) a skill's mode for you, everyone, or one chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/SkillModeOrNull" }
                scope:
                  type: string
                  enum: [user, workspace, chat]
                  default: user
                  description: "`workspace` needs editor access at the root."
                thread: { type: string, description: The chat, for scope `chat`. }
      responses:
        "200":
          description: The skill as you now see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [skills]
      operationId: deleteSkill
      summary: Delete a workspace skill's whole folder under skills/ (editors)
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [name, deleted]
                properties:
                  name: { type: string }
                  deleted: { type: integer, description: How many files. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /skills/{name}/export:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    get:
      tags: [skills]
      operationId: exportSkill
      summary: The skill as a .zip (<name>/SKILL.md, ...)
      responses:
        "200":
          description: The .zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub:
    get:
      tags: [hub]
      operationId: listHubSkills
      summary: The skill hub (needs storage; 404 without it)
      description: Every /hub route needs access to the workspace root (403 without it).
      parameters:
        - name: q
          in: query
          description: Words to look for in names and descriptions.
          schema: { type: string }
      responses:
        "200":
          description: The hub's skills.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HubList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [hub]
      operationId: publishHubSkill
      summary: Publish a workspace skill to the hub, as a new version when it changed (owners)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill]
              properties:
                skill: { type: string, description: The workspace skill's name. }
      responses:
        "201":
          description: Published (or `unchanged`, when the newest version has the same files).
          content:
            application/json:
              schema:
                type: object
                required: [name, version, unchanged]
                properties:
                  name: { type: string }
                  version: { type: integer }
                  unchanged: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    get:
      tags: [hub]
      operationId: getHubSkill
      summary: A hub skill's versions, and one version's SKILL.md
      parameters:
        - $ref: "#/components/parameters/HubVersion"
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HubDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/install:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    put:
      tags: [hub]
      operationId: installHubSkill
      summary: Install a hub skill, or move its pin to another version (editors)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: [integer, "null"], minimum: 1, description: Leave out for the newest. }
      responses:
        "200":
          description: Installed at that version.
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name: { type: string }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [hub]
      operationId: uninstallHubSkill
      summary: Uninstall a hub skill (editors)
      responses:
        "200":
          description: Uninstalled.
          content:
            application/json:
              schema:
                type: object
                required: [name, installed]
                properties:
                  name: { type: string }
                  installed: { type: "null" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/fork:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    post:
      tags: [hub]
      operationId: forkHubSkill
      summary: Copy a hub skill into the workspace's skills/ to change it (editors)
      responses:
        "201":
          description: Copied.
          content:
            application/json:
              schema:
                type: object
                required: [name, path]
                properties:
                  name: { type: string }
                  path: { type: string, description: Its SKILL.md in the workspace. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/diff:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    get:
      tags: [hub]
      operationId: diffHubSkill
      summary: What changed between two versions
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The changed files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HubDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/verify:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    post:
      tags: [hub]
      operationId: verifyHubSkill
      summary: Mark a version checked, or not (hub admins, HUB_ADMINS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                verified: { type: boolean, default: true }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [name, version, verified]
                properties:
                  name: { type: string }
                  version: { type: integer }
                  verified: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/yank:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    post:
      tags: [hub]
      operationId: yankHubSkill
      summary: Withdraw a version, or bring it back (its publisher, hub admins)
      description: A yanked version still works where it is installed; new installs skip it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                yanked: { type: boolean, default: true }
                reason: { type: [string, "null"] }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [name, version, yanked]
                properties:
                  name: { type: string }
                  version: { type: integer }
                  yanked: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /hub/{name}/reports:
    parameters:
      - $ref: "#/components/parameters/SkillName"
    post:
      tags: [hub]
      operationId: reportHubSkill
      summary: Report a hub skill to its publisher and the hub admins (anyone who reads the workspace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                version: { type: [integer, "null"], minimum: 1 }
      responses:
        "201":
          description: Reported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdOnly" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [hub]
      operationId: dismissHubReport
      summary: Dismiss a report (hub admins)
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dismissed.
          content:
            application/json:
              schema:
                type: object
                required: [id, dismissed]
                properties:
                  id: { type: string }
                  dismissed: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

components:
  securitySchemes:
    user:
      type: apiKey
      in: header
      name: X-Knowledge-User
      description: A signed identity token for the signed-in user, sent by the Next.js server when login is on.
    storage:
      type: apiKey
      in: header
      name: X-Knowledge-Storage
      description: "A storage token (aud \"storage\"): Claude acting for its user through an outside service, with the limits listed above."

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: The file's path in its place, such as notes/plan.md; each segment URL-encoded, slashes kept.
      schema: { type: string }
      x-path-rest: true
    Node:
      name: node
      in: query
      description: A knowledge node's files; leave out both node and experiment for the workspace root.
      schema: { type: string }
    SkillName:
      name: name
      in: path
      required: true
      description: A skill's name (lowercase letters, digits and dashes).
      schema: { type: string }
    HubVersion:
      name: version
      in: query
      description: A version number; leave out for the newest.
      schema: { type: integer, minimum: 1 }
    Experiment:
      name: experiment
      in: query
      description: An experiment's files, instead of a node's.
      schema: { type: string }

  responses:
    Conflict:
      description: Something is in the way, such as a skill folder of that name or a read-only file in it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is malformed or names something invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignIn:
      description: Nobody signed in, or the identity or storage token is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this (or a storage token may not).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenOrReadOnly:
      description: Not allowed, or the file is read-only (then `readOnly` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, not visible to the user, or storage isn't configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Exists:
      description: A create-only write, or a rename, to a path that already has a file (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExperimentExists:
      description: An experiment already has this id, even a deleted one (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is over the size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageError:
      description: Storage failed (or failed to start).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Starting:
      description: Storage is still starting; try again shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeletedId:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { type: string, description: The id. }
    CreatedId:
      description: Created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IdOnly" }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        readOnly: { type: boolean, const: true, description: The file is read-only. }
        exists: { type: boolean, const: true, description: The path already has a file. }

    IdOnly:
      type: object
      required: [id]
      properties:
        id: { type: string }

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.

    AuthorType:
      type: string
      enum: [user, agent]

    FileKind:
      type: string
      enum: [note, skill, upload, artifact]
      description: From the path's top folder (packages/contracts/src/files.ts KIND_FOLDERS).

    Role:
      type: string
      enum: [viewer, editor, owner]

    RoleOrNull:
      oneOf:
        - $ref: "#/components/schemas/Role"
        - type: "null"

    FileInfo:
      type: object
      required: [path, kind, mime, size, sha256, updatedAt, author, readOnly]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }
        readOnly: { type: boolean }

    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    FileVersion:
      type: object
      required: [id, sha256, size, mime, author, authorId, createdAt]
      properties:
        id: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/FileVersion" }

    FileEvent:
      type: object
      required: [op, node, path]
      properties:
        op: { type: string, enum: [write, delete] }
        node: { type: [string, "null"] }
        experiment: { type: [string, "null"] }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        author: { $ref: "#/components/schemas/AuthorType" }

    NodeEvent:
      type: object
      required: [op, change, id]
      properties:
        op: { type: string, const: node }
        change: { type: string, enum: [create, rename, delete] }
        id: { type: string }

    ExperimentEvent:
      type: object
      required: [op, change, id, node]
      properties:
        op: { type: string, const: experiment }
        change: { type: string, enum: [create, update, status, delete] }
        id: { type: string }
        node: { type: [string, "null"], description: null for an experiment at the workspace root. }

    ProposalEvent:
      type: object
      required: [op, change, id, node, path, author, authorId]
      properties:
        op: { type: string, const: proposal }
        change: { type: string, enum: [create, update, accepted, rejected, withdrawn] }
        id: { type: string }
        node: { type: [string, "null"] }
        path: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string }

    WorkspaceEvent:
      description: One change on the /files?watch stream.
      oneOf:
        - $ref: "#/components/schemas/FileEvent"
        - $ref: "#/components/schemas/NodeEvent"
        - $ref: "#/components/schemas/ExperimentEvent"
        - $ref: "#/components/schemas/ProposalEvent"

    NodeType:
      type: object
      required: [name, depth]
      properties:
        name: { type: string, description: "A level of the tree, such as tech (depth 1) or process (depth 4)." }
        depth: { type: integer, minimum: 1 }

    KnowledgeNode:
      type: object
      required: [id, parentId, type, depth, name, fileCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"] }
        type: { type: string }
        depth: { type: integer, minimum: 1 }
        name: { type: string }
        fileCount: { type: integer, minimum: 0, description: Live files attached directly to this node. }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    VisibleNode:
      allOf:
        - $ref: "#/components/schemas/KnowledgeNode"
        - type: object
          required: [role]
          properties:
            role:
              description: The user's role; null for a node shown only because something below it is visible (its fileCount is then 0).
              $ref: "#/components/schemas/RoleOrNull"

    Tree:
      type: object
      required: [types, rootRole, nodes]
      properties:
        types:
          type: array
          items: { $ref: "#/components/schemas/NodeType" }
        rootRole: { $ref: "#/components/schemas/RoleOrNull" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/VisibleNode" }

    ExperimentStatus:
      type: string
      enum: [draft, shared, archived]
      description: Who sees it. A draft only its author; shared or archived everyone who can view its node.

    ExperimentState:
      type: string
      enum: [ready, running, done, failed]
      description: How far a run got.

    ExperimentInput:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true }
        results: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state: { $ref: "#/components/schemas/ExperimentState" }

    Experiment:
      type: object
      required:
        [id, nodeId, authorId, authorName, title, hypothesis, params, results, status, state,
         forkedAt, updatedAt, fileCount, provenance, access, mine]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null at the workspace root. }
        authorId: { type: string }
        authorName: { type: [string, "null"] }
        title: { type: string }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true }
        results: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state: { $ref: "#/components/schemas/ExperimentState" }
        forkedAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        fileCount: { type: integer, minimum: 0 }
        provenance:
          description: Where a run came from; {} when nobody recorded it.
          type: object
          additionalProperties: true
        access:
          type: string
          enum: [writer, reader]
          description: "writer: its author, while it isn't archived. reader: may look."
        mine: { type: boolean, description: Whether the asking user is its author. }

    ExperimentUploadMeta:
      description: The `meta` part of an experiment upload, as JSON.
      allOf:
        - type: object
          required: [id, path, title]
          properties:
            id: { type: string, format: uuid, description: The new experiment's id. }
            path:
              description: A node name for every level, top level first; empty (or null) for `None`.
              oneOf:
                - { type: string, description: 'Names joined with "/", e.g. "Etch/Module 3//".' }
                - type: array
                  items: { type: [string, "null"] }
        - $ref: "#/components/schemas/ExperimentInput"

    ExperimentUpload:
      type: object
      required: [experiment, lineage, created, files]
      properties:
        experiment: { $ref: "#/components/schemas/Experiment" }
        lineage:
          description: The node it sits on and that node's ancestors, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        created:
          description: The nodes of the path that didn't exist and were added for it, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    RunInputSource:
      type: object
      required: [path]
      properties:
        path: { type: string }
        node: { type: [string, "null"], description: Its knowledge node; null or left out for the workspace root. }
        experiment: { type: [string, "null"], description: Its experiment, instead of a node. }
        as: { type: string, description: Its name under inputs/; its own file name by default. }

    SearchHit:
      type: object
      required: [path, kind, mime, node, experiment, where, experimentTitle, snippet, match, updatedAt, author]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        node: { type: [string, "null"], description: null at the root or in an experiment. }
        experiment: { type: [string, "null"] }
        where:
          description: Node names from the top down to the file's node.
          type: array
          items: { type: string }
        experimentTitle: { type: [string, "null"] }
        snippet: { type: string, description: The passage that matched; "" when only the path did. }
        match:
          type: string
          enum: [words, meaning]
          description: "words: its text or path has the words; meaning: only a passage close in meaning."
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }

    ProposalStatus:
      type: string
      enum: [open, accepted, rejected, withdrawn]

    Proposal:
      type: object
      required:
        [id, node, path, sha256, size, mime, author, authorId, authorName, experiment, experimentTitle,
         note, status, decidedByName, decidedAt, createdAt, updatedAt, isNew, fileChanged, mine, canDecide]
      properties:
        id: { type: string }
        node: { type: [string, "null"], description: The node whose file it changes; null for the workspace root. }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string, description: The user, or the user Claude was acting for. }
        authorName: { type: [string, "null"] }
        experiment: { type: [string, "null"], description: The experiment it was promoted from. }
        experimentTitle: { type: [string, "null"] }
        note: { type: string }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        decidedByName: { type: [string, "null"] }
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        isNew: { type: boolean, description: No live file at the path yet; accepting creates it. }
        fileChanged: { type: boolean, description: The file changed after this was proposed. }
        mine: { type: boolean, description: Whether the asking user proposed it (and may withdraw it). }
        canDecide: { type: boolean, description: Whether the asking user may accept or reject it. }

    ProposalList:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }

    Promotable:
      type: object
      required: [path, change, size, mime, proposal]
      properties:
        path: { type: string }
        change:
          type: string
          enum: [new, changed]
          description: "new: the node has no file there; changed: the node's differs."
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        proposal: { type: [string, "null"], description: This experiment's open proposal with exactly these bytes. }

    ChatSummary:
      type: object
      required: [id, name, agentId, archived, createdAt, updatedAt, lastRunAt]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        agentId: { type: string }
        archived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastRunAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ChatRun:
      type: object
      required: [runId, parentRunId, events, createdAt]
      properties:
        runId: { type: string }
        parentRunId: { type: [string, "null"] }
        events:
          description: The run's AG-UI events, compacted.
          type: array
          items: {}
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    User:
      type: object
      required: [id, subject, email, name]
      properties:
        id: { type: string }
        subject: { type: string }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }

    Person:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [createdAt, lastSeenAt, role, grantId, effectiveRole, groupIds]
          properties:
            createdAt: { $ref: "#/components/schemas/Timestamp" }
            lastSeenAt:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            role:
              description: Their own grant on the whole workspace, if any.
              $ref: "#/components/schemas/RoleOrNull"
            grantId: { type: [string, "null"] }
            effectiveRole:
              description: Their best workspace role, groups included.
              $ref: "#/components/schemas/RoleOrNull"
            groupIds:
              type: array
              items: { type: string }

    Group:
      type: object
      required: [id, parentId, name, memberIds]
      properties:
        id: { type: string }
        parentId: { type: [string, "null"] }
        name: { type: string }
        memberIds:
          description: Direct members; members of sub-groups are listed on those groups.
          type: array
          items: { type: string }

    Grant:
      type: object
      required: [id, nodeId, principalType, principalId, role, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null for the whole workspace. }
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    AuditEntry:
      type: object
      required: [id, actorType, actorId, action, target, at]
      properties:
        id: { type: string }
        actorType: { type: string, enum: [user, agent] }
        actorId: { type: [string, "null"] }
        action: { type: string, description: "Such as node.create, group.add_member or grant.set." }
        target: { type: object, additionalProperties: true }
        at: { $ref: "#/components/schemas/Timestamp" }

    # --- Server, tools and suggestions ---

    RunAgentInput:
      type: object
      description: An AG-UI run request (https://docs.ag-ui.com); only the fields /suggest reads are listed.
      additionalProperties: true
      required: [threadId, runId, messages]
      properties:
        threadId: { type: string }
        runId: { type: string }
        messages: { type: array, items: { type: object, additionalProperties: true } }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        context: { type: array, items: { type: object, additionalProperties: true } }

    AgUiEvent:
      type: object
      description: One AG-UI event (https://docs.ag-ui.com), by `type`.
      additionalProperties: true
      required: [type]
      properties:
        type: { type: string }

    ToolMenuItem:
      type: object
      required: [server, label, chip, description, icon, mode, callable]
      properties:
        server: { type: string, description: Its name in MCP_SERVERS. }
        label: { type: string }
        chip: { type: string, description: The chip's text in the composer. }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        mode: { type: string, enum: [auto, manual] }
        callable:
          type: array
          description: Tools the app may call with POST /tools/{server}/{tool}.
          items: { type: string }

    # --- Skills and the hub ---

    SkillMode:
      type: string
      enum: [auto, manual, off]
    SkillModeOrNull:
      oneOf:
        - $ref: "#/components/schemas/SkillMode"
        - type: "null"
    SkillSource:
      type: string
      enum: [builtin, workspace, hub]

    HubPin:
      type: object
      description: An installed hub skill's version, the newest one to update to, and their standing.
      required: [version, latest, verified, yanked, yankReason]
      properties:
        version: { type: integer }
        latest: { type: integer, description: The newest version that isn't yanked. }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }

    SkillInfo:
      type: object
      required: [name, description, argumentHint, source, path, modelInvocable, userInvocable, needsExecution,
                 mode, defaultMode, workspaceMode, userMode, chatMode, hub]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"], description: "Shown after /name in the slash menu, such as [file]." }
        source: { $ref: "#/components/schemas/SkillSource" }
        path: { type: [string, "null"], description: Its SKILL.md in the workspace; null for built-in skills. }
        modelInvocable: { type: boolean, description: "False when its front matter says disable-model-invocation: never auto." }
        userInvocable: { type: boolean, description: "False when its front matter says user-invocable: false: no /name." }
        needsExecution: { type: boolean, description: It ships scripts or asks for a shell. }
        mode: { $ref: "#/components/schemas/SkillMode" }
        defaultMode: { $ref: "#/components/schemas/SkillMode" }
        workspaceMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        userMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        chatMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        hub:
          oneOf:
            - $ref: "#/components/schemas/HubPin"
            - type: "null"

    SkillList:
      type: object
      required: [skills, canSetDefaults, canPublish, hub, scripts]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillInfo" }
        canSetDefaults: { type: boolean, description: "Editor at the root: may set defaults and add skills." }
        canPublish: { type: boolean, description: Owner at the root. }
        hub: { type: boolean, description: There is a hub (it needs storage). }
        scripts: { type: boolean, description: "Skills' scripts run (SKILL_SCRIPTS=on)." }

    ScanFlag:
      type: object
      required: [kind, path, line, detail]
      properties:
        kind: { type: string, enum: [scripts, network, large, binary, hidden-text, instructions] }
        path: { type: string }
        line: { type: [integer, "null"] }
        detail: { type: string }

    HubListing:
      type: object
      required: [name, description, argumentHint, modelInvocable, userInvocable, needsExecution, publisher, mine,
                 latest, verified, yanked, flags, updatedAt, installed, reports]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"] }
        modelInvocable: { type: boolean }
        userInvocable: { type: boolean }
        needsExecution: { type: boolean }
        publisher: { type: [string, "null"], description: Who first published it. }
        mine: { type: boolean, description: You published it. }
        latest: { type: integer }
        verified: { type: boolean, description: About `latest`. }
        yanked: { type: boolean, description: About `latest`. }
        flags: { type: integer, description: "How many scan flags `latest` has." }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        installed: { type: [integer, "null"], description: The version installed in this workspace. }
        reports: { type: [integer, "null"], description: Open reports, for hub admins and the publisher. }

    HubVersion:
      type: object
      required: [version, publishedAt, publishedBy, files, size, needsExecution, verified, yanked, yankReason, flags]
      properties:
        version: { type: integer }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedBy: { type: [string, "null"] }
        files: { type: integer }
        size: { type: integer }
        needsExecution: { type: boolean }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }
        flags:
          type: array
          items: { $ref: "#/components/schemas/ScanFlag" }

    HubReport:
      type: object
      required: [id, version, reason, reporter, createdAt]
      properties:
        id: { type: string }
        version: { type: [integer, "null"] }
        reason: { type: string }
        reporter: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    HubDetail:
      allOf:
        - $ref: "#/components/schemas/HubListing"
        - type: object
          required: [versions, version, skillMd, canModerate, canYank, openReports]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/HubVersion" }
            version: { type: integer, description: The version shown. }
            skillMd: { type: string, description: "That version's SKILL.md." }
            canModerate: { type: boolean, description: "A hub admin: may verify and dismiss reports." }
            canYank: { type: boolean }
            openReports:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/HubReport" }
                - type: "null"

    HubList:
      type: object
      required: [skills, canInstall, canPublish, isAdmin]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/HubListing" }
        canInstall: { type: boolean }
        canPublish: { type: boolean }
        isAdmin: { type: boolean }

    HubDiffFile:
      type: object
      required: [path, change, before, after, binary]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before: { type: [string, "null"] }
        after: { type: [string, "null"] }
        binary: { type: boolean }

    HubDiff:
      type: object
      required: [name, from, to, files, flags]
      properties:
        name: { type: string }
        from: { type: integer }
        to: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/HubDiffFile" }
        flags:
          type: array
          description: "What the scan found in `to`."
          items: { $ref: "#/components/schemas/ScanFlag" }
