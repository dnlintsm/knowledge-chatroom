        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /chats/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [chats]
      operationId: listChatRuns
      summary: A chat's runs, in order
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
