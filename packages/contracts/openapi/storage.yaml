  # --- Health, identity tokens, suggestions, outside tools, skills, the hub and memory ---

  /health:
    get:
      tags: [server]
      operationId: getHealth
      summary: The server is up
      security: [{}]
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
                  rowSecurity:
                    type: string
                    enum: ["on", "off"]
                    description: |
                      Once storage is open: whether Postgres enforces access too (row-level
                      security). `off` means only the app's own checks apply; the database user
                      can't use the restricted role. Absent before storage opens and without a database.
        "503":
          description: |
            Up, but not serving storage: the database is unreachable or waiting for its migrations,
            storage has not opened yet, or `ROW_SECURITY=required` and row-level security is off.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, const: degraded }
                  database:
                    type: string
                    enum: [ready, behind, ahead, down]
                    description: |
                      `down`: it can't be reached. `behind`: migrations are not applied yet.
                      `ahead`: it has migrations this server doesn't know. `ready`: its migrations
                      are applied, and something else keeps storage closed (see `rowSecurity`).
                  rowSecurity:
                    type: string
                    enum: ["on", "off"]
                    description: As in the 200 answer. `off` here with `ROW_SECURITY=required` is why storage is refused.

  /identity/public-key:
    get:
      tags: [server]
      operationId: getIdentityPublicKey
      summary: The Ed25519 key that verifies identity and storage tokens
      description: |
        Outside services (MCP servers, a remote agent backend) verify `X-Knowledge-User` and
        `X-Knowledge-Storage` tokens with this key instead of AUTH_SECRET (docs/remote-agent.md).
      security: [{}]
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                type: object
                required: [alg, key]
                properties:
                  alg: { type: string, const: Ed25519 }
                  key: { type: string, description: The raw public key, base64url. }
        "404":
          description: Login is off, so there are no identity tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /identity/mcp-tokens:
    post:
      tags: [server]
      operationId: tradeMcpTokens
      summary: "A remote backend's tokens for its outside MCP servers"
      description: |
        A remote backend's chat agent (AGENT_URL) connects to the servers in its own MCP_SERVERS
        and forwards the user to them as this agent does, but holds no AUTH_SECRET. With the
        run's `X-Knowledge-Storage` token (and `X-Knowledge-Memory`, for memory tokens), both
        `via` "remote", it gets per server: an identity token with `aud` "mcp:<name>"
        (forwardIdentity), a storage token and a memory token `via` "mcp:<name>"
        (storageAccess, memoryAccess). They are for the same user and chat and expire no later
        than the tokens they came from; tokens made for an outside service can't be traded.
        Without login it needs no storage token and gives only memory tokens, in the unsigned
        local form.
      security:
        - storage: []
        - storage: []
          memory: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servers]
              properties:
                servers:
                  type: object
                  maxProperties: 32
                  description: The tokens wanted, by server name.
                  additionalProperties:
                    type: array
                    items: { type: string, enum: [identity, storage, memory] }
      responses:
        "200":
          description: "The tokens made, by server name: a kind is missing when the run has none (no login, or no memory in this chat)."
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        identity: { type: string }
                        storage: { type: string }
                        memory: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }

  /suggest:
    post:
      tags: [server]
      operationId: suggestFollowUps
      summary: Follow-up chips for the chat
      security: [{}, {user: []}]
      description: |
        One Messages API call on a small model that answers CopilotKit's forced
        `copilotkitSuggest` tool call (services/api-py/api_py/suggest.py). The body is an AG-UI
        RunAgentInput whose `tools` include `copilotkitSuggest`; the answer is an AG-UI event
        stream: RUN_STARTED, then the tool call (TOOL_CALL_START, TOOL_CALL_ARGS,
        TOOL_CALL_END) and RUN_FINISHED, or RUN_ERROR with the reason. Nothing is stored.
        The events come as Server-Sent Events for `Accept: text/event-stream` (what the app
        sends), and as AG-UI protobuf otherwise, as the AG-UI encoder picks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunAgentInput" }
      responses:
        "200":
          description: AG-UI events.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Lines of `data: <AG-UI event JSON>` separated by blank lines."
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
            application/vnd.ag-ui.event+proto:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404":
          description: Chat is served by a remote backend (AGENT_URL), which answers this instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tools:
    get:
      tags: [tools]
      operationId: listTools
      summary: The chat's "+" menu of outside tools
      security: [{}, {user: []}]
      description: The MCP servers in MCP_SERVERS that have a `ui` block (services/api-py/api_py/tools.py).
      responses:
        "200":
          description: The menu.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items: { $ref: "#/components/schemas/ToolMenuItem" }
        "401": { $ref: "#/components/responses/SignIn" }

  /tools/{server}/{tool}:
    parameters:
      - name: server
        in: path
        required: true
        schema: { type: string }
      - name: tool
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tools]
      operationId: callTool
      summary: Call one of a menu server's tools as the signed-in user
      security: [{}, {user: []}]
      description: Only the tools in that server's `ui.tools` (its `callable` list in the menu).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arguments]
              properties:
                arguments: { type: object, additionalProperties: true }
      responses:
        "200":
          description: What the tool answered.
          content:
            application/json:
              schema:
                type: object
                required: [result, text]
                properties:
                  result:
                    description: Its structured content, or the JSON in its text, or null.
                  text: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403":
