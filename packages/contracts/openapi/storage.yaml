      responses:
        "200": { $ref: "#/components/responses/PackAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/installs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [memory]
      operationId: uninstallMemoryPack
      summary: Uninstall a pack, with its notes (its place's editors)
      security: [{}, {user: []}]
      responses:
        "200":
          description: Uninstalled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/installs/{id}/fork:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [memory]
      operationId: forkMemoryPack
      summary: "Make an installed pack's notes the place's own"
      security: [{}, {user: []}]
      responses:
        "200":
          description: Forked.
          content:
            application/json:
              schema:
                type: object
                required: [id, notes]
                properties:
                  id: { type: string }
                  notes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/agent:
    get:
      tags: [memory]
      operationId: getMemoryAgent
      summary: "An outside MCP server's view of one chat's memory: the prompt and the tools"
      description: |
        With an `X-Knowledge-Memory` token (memoryAccess in MCP_SERVERS), a server uses the
        user's memory in the chat the token was made for, through the same memory_* tools
        Claude has. Its changes always wait in the user's inbox (or go to a shared note's
        editors).

        A token `via` "remote", which the app makes for each run of a remote backend's chat
        agent (AGENT_URL), is Claude in that chat: it also gets chats_search and chats_read,
        and the prompt and changes Claude gets there (made with Undo while memory is on,
        until the run has used another tool; see `tainted` on the tool calls).
      security:
        - memory: []
      responses:
        "200":
          description: The memory section for the server's own model, and the tools.
          content:
            application/json:
              schema:
                type: object
                required: [prompt, tools]
                properties:
                  prompt: { type: string }
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, description, inputSchema]
                      properties:
                        name: { type: string }
                        description: { type: string }
                        inputSchema: { type: object, additionalProperties: true, description: A JSON Schema. }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/MemoryOffInChat" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/agent/tools/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, enum: [memory_view, memory_search, memory_save, memory_edit, memory_delete, chats_search, chats_read] }
      - name: tainted
        in: query
        description: |
          Remote chat agents only (via "remote"): the run has used a tool other than memory's,
          so changes wait in the inbox. Pass on what the last call answered in `tainted`.
          Ignored for an outside server, whose changes always wait.
        schema: { type: string, enum: ["0", "1", "true", "false"] }
      - name: run
        in: query
        description: Remote chat agents only, the AG-UI run id, kept with the notes the call reads and changes.
        schema: { type: string, maxLength: 200 }
    post:
      tags: [memory]
      operationId: callMemoryTool
      summary: Call one memory tool for an outside MCP server or a remote chat agent
      description: chats_search and chats_read are for remote chat agents only (404 for an outside server).
      security:
        - memory: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: "The tool's arguments, as its inputSchema says." }
      responses:
        "200":
          description: What the tool answered.
          content:
            application/json:
              schema:
                type: object
                required: [text, isError, events, tainted]
                properties:
                  text: { type: string }
                  isError: { type: boolean }
                  events:
                    type: array
                    description: The notes this call read or changed, for the chat's "Used / Updated" line.
                    items: { $ref: "#/components/schemas/MemoryEvent" }
                  tainted:
                    type: boolean
                    description: Whether the run's later changes wait in the inbox (reading a shared note or a past chat sets it).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/MemoryOffInChat" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

components:
  securitySchemes:
    user:
      type: apiKey
      in: header
      name: X-Knowledge-User
      description: A signed identity token for the signed-in user, sent by the Next.js server when login is on.
    storage:
      type: apiKey
      in: header
      name: X-Knowledge-Storage
      description: "A storage token (aud \"storage\"): Claude acting for its user through an outside service, with the limits listed above."
    memory:
      type: apiKey
      in: header
      name: X-Knowledge-Memory
      description: "A memory token (aud \"memory\") for one chat run, for /memory/agent only: an outside MCP server using that chat's memory."

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: The file's path in its place, such as notes/plan.md; each segment URL-encoded, slashes kept.
      schema: { type: string }
      x-path-rest: true
    Node:
      name: node
      in: query
      description: A knowledge node's files; leave out both node and experiment for the workspace root.
      schema: { type: string }
    SkillName:
      name: name
      in: path
      required: true
      description: A skill's name (lowercase letters, digits and dashes).
      schema: { type: string }
    MemoryName:
      name: name
      in: path
      required: true
      description: "A note's or a pack's name: lowercase letters, digits and dashes (e.g. writing-style)."
      schema: { type: string }
    HubVersion:
      name: version
      in: query
      description: A version number; leave out for the newest.
      schema: { type: integer, minimum: 1 }
    Archived:
      name: archived
      in: query
      description: 1 (or true, or empty) to take in archived runs too.
      schema: { type: string }
    Experiment:
      name: experiment
      in: query
      description: An experiment's files, instead of a node's.
      schema: { type: string }

  responses:
    ExperimentIfVisible:
      description: The experiment now, or null once you can't see it (a draft you handed over or left).
      content:
        application/json:
          schema:
            type: object
            required: [experiment]
            properties:
              experiment:
                oneOf:
                  - $ref: "#/components/schemas/Experiment"
                  - type: "null"
    MemoryNotFound:
      description: No such note (or proposal, pack, install), or memory is off on this server (MEMORY=on) or has no storage.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryChanged:
      description: The note changed since (or the name is in use, or the change was already undone).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryOffInChat:
      description: Memory is off in that chat (incognito, or turned off).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryNoteAnswer:
      description: The note now.
      content:
        application/json:
          schema:
            type: object
            required: [note]
            properties:
              note: { $ref: "#/components/schemas/MemoryNote" }
    PackAnswer:
      description: The pack, at that version.
      content:
        application/json:
          schema:
            type: object
            required: [pack]
            properties:
              pack: { $ref: "#/components/schemas/PackDetail" }
    RunRunning:
      description: Another run of this experiment is running; `running` is its number.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Something is in the way, such as a skill folder of that name.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is malformed or names something invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignIn:
      description: Nobody signed in, or the identity or storage token is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this (or a storage token may not).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, not visible to the user, or storage isn't configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Exists:
      description: A create-only write, or a rename, to a path that already has a file (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExistsOrChanged:
      description: |
        A create-only write to a path that already has a file (`exists` is true), or an If-Match
        write to a file that is another version now (`changed` is true, with its `sha256` now:
        null when the file is gone).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProposalChanged:
      description: |
        The accept named what its reviewer saw, and the proposal was revised or its file changed
        since (`changed` is true). Nothing was written; read both again.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExperimentExists:
      description: An experiment already has this id, even a deleted one (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is over the size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageError:
      description: Storage failed (or failed to start).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Starting:
      description: Storage is still starting; try again shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeletedId:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { type: string, description: The id. }
    CreatedId:
      description: Created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IdOnly" }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }

  schemas:
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    WorkspaceStatus:
      type: string
      enum: [active, archived]

    Workspace:
      type: object
      required: [id, slug, name, role, status]
      properties:
        id: { type: string, description: The immutable id that selectors and tokens carry. }
        slug: { type: string, description: "For page URLs (/w/<slug>/); it can change." }
        name: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        status: { $ref: "#/components/schemas/WorkspaceStatus" }

    MemberRemoval:
      type: object
      required: [grants, groups, collaborations, experiments]
      properties:
        grants: { type: integer, description: Their direct grants in the workspace. }
        collaborations: { type: integer, description: How many Experiments they collaborate on. }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MemberRemovalGroup" }
        experiments:
          type: array
          description: Shared or archived Experiments they maintain that you can see.
          items: { $ref: "#/components/schemas/MemberRemovalExperiment" }

    # Named, so the generated models don't take the names Group and Experiment.
    MemberRemovalGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    MemberRemovalExperiment:
      type: object
      required: [id, title, nodeId]
      properties:
        id: { type: string }
        title: { type: string }
        nodeId: { type: [string, "null"] }

    AlreadyMember:
      type: object
      required: [error, role]
      properties:
        error: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    WorkspaceMember:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        email: { type: [string, "null"], description: For Owners and Admins only. }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    PlatformWorkspace:
      type: object
      required: [id, slug, name, status, createdAt, createdBy, memberCount, owners, lastActiveAt, fullAccessHeld]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/WorkspaceStatus" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy:
          oneOf:
            - $ref: "#/components/schemas/PlatformWorkspaceCreator"
            - type: "null"
        memberCount: { type: integer }
        owners:
          type: array
          items: { $ref: "#/components/schemas/PlatformWorkspaceOwner" }
        lastActiveAt:
          description: The latest audit entry, chat run, file or Experiment change; null if none.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        fullAccessHeld:
          type: boolean
          description: |
            Whether a member who signed in within the server's RECOVERY_IDLE_DAYS holds Full
            access on the root, directly or through a group. The screen preselects
            `fullAccess` when not.

    PlatformWorkspaceCreator:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }

    PlatformWorkspaceOwner:
      type: object
      required: [id, name, email, lastSeenAt]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        lastSeenAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        exists: { type: boolean, const: true, description: The path already has a file. }
        changed:
          type: boolean
          const: true
          description: What the request named as seen (If-Match, or an accept's sha256 and base) is another version now.
        sha256:
          type: [string, "null"]
          description: With `changed` on a file write, the file's version now; null when it is gone.
        running: { type: integer, minimum: 1, description: "On a 409 starting a run: the number of the run that is running." }

    IdOnly:
      type: object
      required: [id]
      properties:
        id: { type: string }

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.

    AuthorType:
      type: string
      enum: [user, agent]

    FileKind:
      type: string
      enum: [note, skill, upload, artifact]
      description: From the path's top folder (packages/contracts/src/files.ts KIND_FOLDERS).

    Role:
      type: string
      enum: [viewer, editor, owner]

    RoleOrNull:
      oneOf:
        - $ref: "#/components/schemas/Role"
        - type: "null"

    FileInfo:
      type: object
      required: [path, kind, mime, size, sha256, updatedAt, author]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }

    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    FileVersion:
      type: object
      required: [id, sha256, size, mime, author, authorId, createdAt]
      properties:
        id: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/FileVersion" }

    FileEvent:
      type: object
      required: [op, node, path]
      properties:
        op: { type: string, enum: [write, delete] }
        node: { type: [string, "null"] }
        experiment: { type: [string, "null"] }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        author: { $ref: "#/components/schemas/AuthorType" }

    NodeEvent:
      type: object
      required: [op, change, id]
      properties:
        op: { type: string, const: node }
        change: { type: string, enum: [create, rename, delete, restrict, unrestrict, takeover] }
        id: { type: string }
        left:
          type: array
          items: { type: string }
          description: >-
            On restrict, the users who just lost access. They hear this change even though
            they can't see the node any more, so it closes for them.

    ExperimentEvent:
      type: object
      required: [op, change, id, node]
      properties:
        op: { type: string, const: experiment }
        change: { type: string, enum: [create, update, status, delete, restore] }
        id: { type: string }
        node: { type: [string, "null"], description: null for an experiment at the workspace root. }
        left:
          type: array
          items: { type: string }
          description: >-
            Users who just stopped working on it (a collaborator removed or leaving, a
            previous maintainer not kept on). They hear this change even when they can't
            see the experiment any more, so an open draft closes for them.

    ProposalEvent:
      type: object
      required: [op, change, id, node, path, author, authorId]
      properties:
        op: { type: string, const: proposal }
        change: { type: string, enum: [create, update, accepted, rejected, withdrawn] }
        id: { type: string }
        node: { type: [string, "null"] }
        path: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string }

    RunEvent:
      type: object
      required: [op, change, id, experiment, node]
      description: A run changed; its experiment's update event follows. Heard by whoever can see the experiment.
      properties:
        op: { type: string, const: run }
        change: { type: string, enum: [create, finish, update, archive, delete, restore] }
        id: { type: string }
        experiment: { type: string }
        node: { type: [string, "null"], description: The experiment's node; null at the workspace root. }

    WorkspaceEvent:
      description: One change on the /files?watch stream.
      oneOf:
        - $ref: "#/components/schemas/FileEvent"
        - $ref: "#/components/schemas/NodeEvent"
        - $ref: "#/components/schemas/ExperimentEvent"
        - $ref: "#/components/schemas/RunEvent"
        - $ref: "#/components/schemas/ProposalEvent"

    NodeType:
      type: object
      required: [name, depth]
      properties:
        name: { type: string, description: "A level of the tree, such as tech (depth 1) or process (depth 4)." }
        depth: { type: integer, minimum: 1 }

    KnowledgeNode:
      type: object
      required: [id, parentId, type, depth, name, fileCount, updatedAt, restricted]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"] }
        type: { type: string }
        depth: { type: integer, minimum: 1 }
        name: { type: string }
        fileCount: { type: integer, minimum: 0, description: Live files attached directly to this node. }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        restricted:
          type: boolean
          description: >-
            Grants above it don't reach it (docs/restricted-knowledge.md). Owners and Admins
            see restricted nodes they can't open, with role null and no files.

    AccessSource:
      type: object
      required: [role, node, group, takeover, since]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        node:
          description: The node the grant is on; null for the workspace root.
          oneOf:
            - $ref: "#/components/schemas/NamedNode"
            - type: "null"
        group:
          description: The group the grant goes through; null for a grant to the person.
          oneOf:
            - $ref: "#/components/schemas/Collaborator"
            - type: "null"
        takeover: { type: boolean, description: An Owner took the node over with this grant. }
        since: { $ref: "#/components/schemas/Timestamp" }

    NamedNode:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    NodeAccess:
      type: object
      required: [nodeId, restricted, inheritanceStopsAt, people]
      properties:
        nodeId: { type: string }
        restricted: { type: boolean }
        inheritanceStopsAt:
          description: The nearest restricted node at or above it; grants above that don't count.
          oneOf:
            - $ref: "#/components/schemas/NamedNode"
            - type: "null"
        people:
          type: array
          items:
            type: object
            required: [user, role, sources]
            properties:
              user: { $ref: "#/components/schemas/Collaborator" }
              role: { $ref: "#/components/schemas/Role" }
              sources:
                type: array
                items: { $ref: "#/components/schemas/AccessSource" }
                description: >-
                  Strongest first; the first decides the role. Empty for an Owner or Admin
                  without Full access on the node, who gets names and roles only.

    Restriction:
      type: object
      required: [nodeId, restricted, restrictedAt, restrictedBy, changes, groups]
      properties:
        nodeId: { type: string }
        restricted: { type: boolean }
        restrictedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        restrictedBy:
          oneOf:
            - $ref: "#/components/schemas/Collaborator"
            - type: "null"
        changes:
          type: array
          description: >-
            What switching it would change, for each person whose role would: restricting an
            open node, or lifting a restricted one.
          items:
            type: object
            required: [user, role, becomes, through, experiments]
            properties:
              user: { $ref: "#/components/schemas/Collaborator" }
              role: { $ref: "#/components/schemas/RoleOrNull" }
              becomes: { $ref: "#/components/schemas/RoleOrNull" }
              through:
                description: The grant that gives the role being lost, or the one being gained.
                oneOf:
                  - $ref: "#/components/schemas/AccessSource"
                  - type: "null"
              experiments:
                type: integer
                minimum: 0
                description: Their Experiments below the node that would close to them.
        groups:
          type: array
          description: >-
            For an open node, the groups whose grants above it would stop reaching it if it were
            restricted, each with its strongest such grant; empty for a restricted node.
          items:
            type: object
            required: [group, role, node]
            properties:
              group: { $ref: "#/components/schemas/Collaborator" }
              role: { $ref: "#/components/schemas/Role" }
              node:
                description: Where the grant is; null for the workspace root.
                oneOf:
                  - $ref: "#/components/schemas/NamedNode"
                  - type: "null"

    VisibleNode:
      allOf:
        - $ref: "#/components/schemas/KnowledgeNode"
        - type: object
          required: [role, takenOver]
          properties:
            role:
              description: The user's role; null for a node shown only because something below it is visible (its fileCount is then 0).
              $ref: "#/components/schemas/RoleOrNull"
            takenOver:
              description: >-
                On a restricted node the user can open, the latest Owner takeover there; else
                null.
              oneOf:
                - $ref: "#/components/schemas/Takeover"
                - type: "null"

    Takeover:
      type: object
      required: [user, at]
      properties:
        user: { $ref: "#/components/schemas/Collaborator" }
        at: { $ref: "#/components/schemas/Timestamp" }

    Tree:
      type: object
      required: [types, rootRole, nodes]
      properties:
        types:
          type: array
          items: { $ref: "#/components/schemas/NodeType" }
        rootRole: { $ref: "#/components/schemas/RoleOrNull" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/VisibleNode" }

    ExperimentStatus:
      type: string
      enum: [draft, shared, archived]
      description: Who sees it. A draft only its maintainer and collaborators; shared or archived everyone who can view its node.

    ExperimentState:
      type: string
      enum: [ready, running, done, failed]
      description: How far a run got.

    ExperimentInput:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true }
        results: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state: { $ref: "#/components/schemas/ExperimentState" }

    Experiment:
      type: object
      required:
        [id, nodeId, authorId, authorName, title, hypothesis, params, results, status, state,
         forkedAt, updatedAt, fileCount, provenance, access, mine, maintainerId, maintainerName,
         maintainerIsMember, collaborators]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null at the workspace root. }
        authorId: { type: string, description: Who created it; never changes. }
        authorName: { type: [string, "null"] }
        title: { type: string }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true, description: The planned parameters; each run has the ones it ran with. }
        results:
          type: object
          additionalProperties: true
          description: Deprecated, kept for one release as its latest live run's results ({} with none).
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state:
          $ref: "#/components/schemas/ExperimentState"
          description: Deprecated, kept for one release as its latest live run's state (ready with none).
        forkedAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        fileCount: { type: integer, minimum: 0 }
        provenance:
          description: >-
            Deprecated, kept for one release as its latest live run's provenance (Run.provenance).
            Where a run came from; {} when nobody recorded it. Once a run finishes (through /finish
            or a PATCH of its state), `files` has the
            version of its models/general_rules.md at the end (null when there was none) and `reads`
            the reads recorded while it ran (RunRead, without `by`).
          type: object
          additionalProperties: true
        access:
          type: string
          enum: [writer, reader]
          description: "writer: its maintainer or a collaborator, while it isn't archived. reader: may look."
        mine:
          type: boolean
          description: Whether the asking user is its maintainer (who changes its status, deletes it and chooses who works on it).
        maintainerId: { type: string, description: Who is responsible for it now; its author until handed over. }
        maintainerName: { type: [string, "null"] }
        maintainerIsMember: { type: boolean, description: Whether its maintainer is still a member of the workspace. }
        collaborators:
          type: array
          description: Members its maintainer added to work on it.
          items: { $ref: "#/components/schemas/Collaborator" }
        deletedAt:
          $ref: "#/components/schemas/Timestamp"
          description: Only in the ?deleted list, when it was deleted.
        deletedBy:
          description: Only in the ?deleted list, who deleted it; null when unknown (deleted with its node) or gone.
          oneOf:
            - { $ref: "#/components/schemas/Collaborator" }
            - type: "null"
        restorable:
          type: boolean
          description: Only in the ?deleted list, false when its node was deleted too (restore answers 409).

    FolderImport:
      type: object
      required: [title, destination, params, files, skipped, restricted, canMove, canPoint]
      properties:
        title: { type: string }
        destination: { type: [string, "null"] }
        params: { type: object, additionalProperties: true, description: "From the folder's params.json; {} without one." }
        files:
          type: array
          items:
            type: object
            required: [path, size]
            properties:
              path: { type: string, description: Relative to the folder, as in the experiment. }
              size: { type: integer, minimum: 0 }
        skipped:
          type: array
          items: { type: string }
          description: Files left out, larger than an upload may be.
        restricted:
          description: The restricted node the folder is in, when the destination is outside it.
          oneOf:
            - type: object
              required: [id, name, fullAccess]
              properties:
                id: { type: string }
                name: { type: string }
                fullAccess: { type: boolean, description: Whether you have Full access there, which importing needs. }
            - type: "null"
        canMove: { type: boolean, description: Edit access where the folder is. }
        canPoint: { type: boolean, description: Edit access where the folder is. }
        experiment:
          $ref: "#/components/schemas/Experiment"
          description: Only once imported.

    RunState:
      type: string
      enum: [running, done, failed]

    RunRecordTaken:
      type: [string, "null"]
      enum: [finish, migration, null]
      description: >-
        When the file record was taken: at finish, or at migration for a run that finished before
        runs had records; null while it runs.

    RunFile:
      type: object
      required: [path, version, sha256, size]
      properties:
        path: { type: string }
        version: { type: string, description: The file version it recorded. }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }

    Run:
      type: object
      description: One execution of an experiment.
      required:
        [id, experimentId, number, label, params, results, state, provenance, startedBy, startedAt,
         finishedAt, fileCount, recordTaken, archived, archivedAt]
      properties:
        id: { type: string }
        experimentId: { type: string }
        number: { type: integer, minimum: 1, description: "Its place in the experiment: Run 1, Run 2, ..." }
        label: { type: string, maxLength: 200 }
        params: { type: object, additionalProperties: true, description: The parameters it ran with. }
        results: { type: object, additionalProperties: true }
        state: { $ref: "#/components/schemas/RunState" }
        provenance:
          type: object
          additionalProperties: true
          description: >-
            Where it came from, as an experiment's provenance: who started it and when, the
            caller's chat, model, skill and tools, its inputs, and rerunOf {id, run} naming the
            experiment and run it reran.
        startedBy:
          description: Who started it; null once they are gone.
          oneOf:
            - { $ref: "#/components/schemas/Collaborator" }
            - type: "null"
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        finishedAt:
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - type: "null"
        fileCount: { type: [integer, "null"], minimum: 0, description: Files in its record; null while it runs. }
        recordTaken: { $ref: "#/components/schemas/RunRecordTaken" }
        archived: { type: boolean }
        archivedAt:
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - type: "null"
        record:
          description: Only on one run (GET /runs/{id} and the routes that change one); null while it runs.
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/RunFile" }
            - type: "null"
        deletedAt:
          $ref: "#/components/schemas/Timestamp"
          description: Only on a deleted run.
        deletedBy:
          description: Only on a deleted run, who deleted it; null once they are gone.
          oneOf:
            - { $ref: "#/components/schemas/Collaborator" }
            - type: "null"

    ComparedRun:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [experiment]
          properties:
            experiment: { $ref: "#/components/schemas/RunExperiment" }

    RunExperiment:
      type: object
      description: The experiment a compared run belongs to.
      required: [id, title, nodeId]
      properties:
        id: { type: string }
        title: { type: string }
        nodeId: { type: [string, "null"] }

    CallerProvenance:
      type: object
      additionalProperties: true
      description: >-
        At most 16 KiB of JSON. startedBy, startedAt, finishedAt, inputs, rerunOf, files
        and reads are the server's and are dropped; other keys are kept as given.
      properties:
        chat: { type: [string, "null"] }
        model: { type: [string, "null"] }
        skill:
          type: [object, "null"]
          required: [name]
          properties:
            name: { type: string }
            source: { type: string }
            version: { type: number }
            sha256: { type: string }
        tools:
          type: [object, "null"]
          additionalProperties: { type: string }
          description: Each tool's version, by name.

    RunRead:
      type: object
      required: [path, version, sha256, via, readAt, by]
      properties:
        path: { type: string }
        version: { type: string, description: "The file version read: one of the file's own." }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        via: { type: string, description: 'Who read it: "remote" for Claude in the chat, "mcp:<name>" for a tool server.' }
        readAt: { $ref: "#/components/schemas/Timestamp", description: When it was first read. }
        by:
          description: The user the agent acted for; null once they are gone.
          oneOf:
            - { $ref: "#/components/schemas/Collaborator" }
            - type: "null"

    Collaborator:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }

    ExperimentUploadMeta:
      description: The `meta` part of an experiment upload, as JSON.
      allOf:
        - type: object
          required: [id, path, title]
          properties:
            id: { type: string, format: uuid, description: The new experiment's id. }
            path:
              description: A node name for every level, top level first; empty (or null) for `None`.
              oneOf:
                - { type: string, description: 'Names joined with "/", e.g. "Etch/Module 3//".' }
                - type: array
                  items: { type: [string, "null"] }
        - $ref: "#/components/schemas/ExperimentInput"

    ExperimentUpload:
      type: object
      required: [experiment, lineage, created, files]
      properties:
        experiment: { $ref: "#/components/schemas/Experiment" }
        lineage:
          description: The node it sits on and that node's ancestors, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        created:
          description: The nodes of the path that didn't exist and were added for it, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    RunInputSource:
      type: object
      required: [path]
      properties:
        path: { type: string }
        node: { type: [string, "null"], description: Its knowledge node; null or left out for the workspace root. }
        experiment: { type: [string, "null"], description: Its experiment, instead of a node. }
        as: { type: string, description: Its name under inputs/; its own file name by default. }

    SearchHit:
      type: object
      required: [path, kind, mime, node, experiment, where, experimentTitle, snippet, match, updatedAt, author]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        node: { type: [string, "null"], description: null at the root or in an experiment. }
        experiment: { type: [string, "null"] }
        where:
          description: Node names from the top down to the file's node.
          type: array
          items: { type: string }
        experimentTitle: { type: [string, "null"] }
        snippet: { type: string, description: The passage that matched; "" when only the path did. }
        match:
          type: string
          enum: [words, meaning]
          description: "words: its text or path has the words; meaning: only a passage close in meaning."
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }

    ProposalStatus:
      type: string
      enum: [open, accepted, rejected, withdrawn]

    Proposal:
      type: object
      required:
        [id, node, path, sha256, size, mime, author, authorId, authorName, experiment, experimentTitle,
         note, status, decidedByName, decidedAt, createdAt, updatedAt, isNew, fileChanged, mine, canDecide]
      properties:
        id: { type: string }
        node: { type: [string, "null"], description: The node whose file it changes; null for the workspace root. }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string, description: The user, or the user Claude was acting for. }
        authorName: { type: [string, "null"] }
        experiment: { type: [string, "null"], description: The experiment it was promoted from. }
        experimentTitle: { type: [string, "null"] }
        note: { type: string }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        decidedByName: { type: [string, "null"] }
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        isNew: { type: boolean, description: No live file at the path yet; accepting creates it. }
        fileChanged: { type: boolean, description: The file changed after this was proposed. }
        mine: { type: boolean, description: Whether the asking user proposed it (and may withdraw it). }
        canDecide: { type: boolean, description: Whether the asking user may accept or reject it. }

    ProposalList:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }

    Promotable:
      type: object
      required: [path, change, size, mime, proposal]
      properties:
        path: { type: string }
        change:
          type: string
          enum: [new, changed]
          description: "new: the node has no file there; changed: the node's differs."
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        proposal: { type: [string, "null"], description: This experiment's open proposal with exactly these bytes. }

    ChatSummary:
      type: object
      required: [id, name, agentId, archived, createdAt, updatedAt, lastRunAt]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        agentId: { type: string }
        archived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastRunAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ChatRun:
      type: object
      required: [runId, parentRunId, events, createdAt]
      properties:
        runId: { type: string }
        parentRunId: { type: [string, "null"] }
        events:
          description: The run's AG-UI events, compacted.
          type: array
          items: {}
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    User:
      type: object
      required: [id, subject, email, name]
      properties:
        id: { type: string }
        subject: { type: string }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }

    UserSummary:
      description: A member as others in the workspace see them.
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email:
          description: Only in answers to the workspace's Owners and Admins.
          type: [string, "null"]

    Person:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [createdAt, lastSeenAt, role, grantId, effectiveRole, groupIds]
          properties:
            createdAt: { $ref: "#/components/schemas/Timestamp" }
            lastSeenAt:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            role:
              description: Their own grant on the whole workspace, if any.
              $ref: "#/components/schemas/RoleOrNull"
            grantId: { type: [string, "null"] }
            effectiveRole:
              description: Their best workspace role, groups included.
              $ref: "#/components/schemas/RoleOrNull"
            groupIds:
              type: array
              items: { type: string }

    Group:
      type: object
      required: [id, parentId, name, memberIds]
      properties:
        id: { type: string }
        parentId: { type: [string, "null"] }
        name: { type: string }
        memberIds:
          description: Direct members; members of sub-groups are listed on those groups.
          type: array
          items: { type: string }

    Grant:
      type: object
      required: [id, nodeId, principalType, principalId, role, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null for the whole workspace. }
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    AuditEntry:
      type: object
      required: [id, actorType, actorId, action, target, at]
      properties:
        id: { type: string }
        actorType: { type: string, enum: [user, agent] }
        actorId: { type: [string, "null"] }
        action: { type: string, description: "Such as node.create, group.add_member or grant.set." }
        target: { type: object, additionalProperties: true }
        at: { $ref: "#/components/schemas/Timestamp" }

    # --- Server, tools and suggestions ---

    RunAgentInput:
      type: object
      description: An AG-UI run request (https://docs.ag-ui.com); only the fields /suggest reads are listed.
      additionalProperties: true
      required: [threadId, runId, messages]
      properties:
        threadId: { type: string }
        runId: { type: string }
        messages: { type: array, items: { type: object, additionalProperties: true } }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        context: { type: array, items: { type: object, additionalProperties: true } }

    AgUiEvent:
      type: object
      description: One AG-UI event (https://docs.ag-ui.com), by `type`.
      additionalProperties: true
      required: [type]
      properties:
        type: { type: string }

    ToolMenuItem:
      type: object
      required: [server, label, chip, description, icon, mode, callable]
      properties:
        server: { type: string, description: Its name in MCP_SERVERS. }
        label: { type: string }
        chip: { type: string, description: The chip's text in the composer. }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        mode: { type: string, enum: [auto, manual] }
        callable:
          type: array
          description: Tools the app may call with POST /tools/{server}/{tool}.
          items: { type: string }

    # --- Skills and the hub ---

    SkillMode:
      type: string
      enum: [auto, manual, off]
    SkillModeOrNull:
      oneOf:
        - $ref: "#/components/schemas/SkillMode"
        - type: "null"
    SkillSource:
      type: string
      enum: [builtin, workspace, hub]

    HubPin:
      type: object
      description: An installed hub skill's version, the newest one to update to, and their standing.
      required: [version, latest, verified, yanked, yankReason]
      properties:
        version: { type: integer }
        latest: { type: integer, description: The newest version that isn't yanked. }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }

    SkillInfo:
      type: object
      required: [name, description, argumentHint, source, path, modelInvocable, userInvocable, needsExecution,
                 mode, defaultMode, workspaceMode, userMode, chatMode, hub]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"], description: "Shown after /name in the slash menu, such as [file]." }
        source: { $ref: "#/components/schemas/SkillSource" }
        path: { type: [string, "null"], description: Its SKILL.md in the workspace; null for built-in skills. }
        modelInvocable: { type: boolean, description: "False when its front matter says disable-model-invocation: never auto." }
        userInvocable: { type: boolean, description: "False when its front matter says user-invocable: false: no /name." }
        needsExecution: { type: boolean, description: It ships scripts or asks for a shell. }
        mode: { $ref: "#/components/schemas/SkillMode" }
        defaultMode: { $ref: "#/components/schemas/SkillMode" }
        workspaceMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        userMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        chatMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        hub:
          oneOf:
            - $ref: "#/components/schemas/HubPin"
            - type: "null"

    RunSkill:
      type: object
      required: [name, mode, source, userInvocable, needsExecution, files]
      properties:
        name: { type: string }
        mode: { type: string, enum: [auto, manual], description: "auto: Claude may use it and /name runs it; manual: only /name." }
        source: { $ref: "#/components/schemas/SkillSource" }
        userInvocable: { type: boolean, description: "False: no /name for it." }
        needsExecution: { type: boolean, description: "It ships scripts, which run only with SKILL_SCRIPTS=on on this server." }
        files:
          type: array
          items: { $ref: "#/components/schemas/RunSkillFile" }
    RunSkillFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Inside the skill's folder, e.g. SKILL.md." }
        content: { type: string, description: "The file's bytes in base64." }
    SkillList:
      type: object
      required: [skills, canSetDefaults, canPublish, hub, scripts]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillInfo" }
        canSetDefaults: { type: boolean, description: "Editor at the root: may set defaults and add skills." }
        canPublish: { type: boolean, description: Owner at the root. }
        hub: { type: boolean, description: There is a hub (it needs storage). }
        scripts: { type: boolean, description: "Skills' scripts run (SKILL_SCRIPTS=on)." }

    ScanFlag:
      type: object
      required: [kind, path, line, detail]
      properties:
        kind: { type: string, enum: [scripts, network, large, binary, hidden-text, instructions] }
        path: { type: string }
        line: { type: [integer, "null"] }
        detail: { type: string }

    HubListing:
      type: object
      required: [name, description, argumentHint, modelInvocable, userInvocable, needsExecution, publisher, mine,
                 latest, verified, yanked, flags, updatedAt, installed, reports]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"] }
        modelInvocable: { type: boolean }
        userInvocable: { type: boolean }
        needsExecution: { type: boolean }
        publisher: { type: [string, "null"], description: Who first published it. }
        mine: { type: boolean, description: You published it. }
        latest: { type: integer }
        verified: { type: boolean, description: About `latest`. }
        yanked: { type: boolean, description: About `latest`. }
        flags: { type: integer, description: "How many scan flags `latest` has." }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        installed: { type: [integer, "null"], description: The version installed in this workspace. }
        reports: { type: [integer, "null"], description: Open reports, for hub admins and the publisher. }

    HubVersion:
      type: object
      required: [version, publishedAt, publishedBy, files, size, needsExecution, verified, yanked, yankReason, flags]
      properties:
        version: { type: integer }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedBy: { type: [string, "null"] }
        files: { type: integer }
        size: { type: integer }
        needsExecution: { type: boolean }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }
        flags:
          type: array
          items: { $ref: "#/components/schemas/ScanFlag" }

    HubReport:
      type: object
      required: [id, version, reason, reporter, createdAt]
      properties:
        id: { type: string }
        version: { type: [integer, "null"] }
        reason: { type: string }
        reporter: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    HubDetail:
      allOf:
        - $ref: "#/components/schemas/HubListing"
        - type: object
          required: [versions, version, skillMd, canModerate, canYank, openReports]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/HubVersion" }
            version: { type: integer, description: The version shown. }
            skillMd: { type: string, description: "That version's SKILL.md." }
            canModerate: { type: boolean, description: "A hub admin: may verify and dismiss reports." }
            canYank: { type: boolean }
            openReports:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/HubReport" }
                - type: "null"

    HubList:
      type: object
      required: [skills, canInstall, canPublish, isAdmin]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/HubListing" }
        canInstall: { type: boolean }
        canPublish: { type: boolean }
        isAdmin: { type: boolean }

    HubDiffFile:
      type: object
      required: [path, change, before, after, binary]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before: { type: [string, "null"] }
        after: { type: [string, "null"] }
        binary: { type: boolean }

    HubDiff:
      type: object
      required: [name, from, to, files, flags]
      properties:
        name: { type: string }
        from: { type: integer }
        to: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/HubDiffFile" }
        flags:
          type: array
          description: "What the scan found in `to`."
          items: { $ref: "#/components/schemas/ScanFlag" }

    # --- Memory ---

    MemoryType:
      type: string
      enum: [preference, profile, project, reference, feedback]
    MemoryMode:
      type: string
      enum: ["on", ask, "off"]
    MemoryAuthor:
      type: string
      enum: [user, agent]

    MemoryInput:
      type: object
      required: [description, type, body]
      properties:
        description: { type: string, description: One line; it goes in the index. }
        type: { type: string, description: "One of MemoryType." }
        body: { type: string, description: The note, in markdown. }

    MemorySummary:
      type: object
      required: [name, description, type, version, createdBy, updatedBy, archived, createdAt, updatedAt, lastUsedAt]
      properties:
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        version: { type: integer }
        createdBy: { $ref: "#/components/schemas/MemoryAuthor" }
        updatedBy: { $ref: "#/components/schemas/MemoryAuthor" }
        archived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    MemoryNote:
      allOf:
        - $ref: "#/components/schemas/MemorySummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    MemoryVersion:
      type: object
      required: [version, description, type, body, changedBy, threadId, createdAt]
      properties:
        version: { type: integer }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }
        changedBy: { $ref: "#/components/schemas/MemoryAuthor" }
        threadId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MemoryEvent:
      type: object
      description: What Claude did with a note in a run, as the chat shows it.
      required: [id, name, description, kind, version]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [read, create, update, archive, propose] }
        version: { type: integer }
        shared:
          type: object
          description: For a shared note, which one and where it lives.
          required: [id, label]
          properties:
            id: { type: string }
            label: { type: string }

    MemoryActivity:
      allOf:
        - $ref: "#/components/schemas/MemoryEvent"
        - type: object
          required: [threadId, source, at, undone, undoable]
          properties:
            threadId: { type: string }
            source: { type: string, enum: [chat, learn, inbox] }
            at: { $ref: "#/components/schemas/Timestamp" }
            undone: { type: boolean }
            undoable: { type: boolean, description: "Still the note's latest change, so Undo can take it back." }

    InboxItem:
      type: object
      description: A change Claude proposed, waiting for the user.
      required: [id, op, name, description, type, body, baseVersion, source, threadId, reason, createdAt]
      properties:
        id: { type: string }
        op: { type: string, enum: [add, update, delete] }
        name: { type: string }
        description: { type: [string, "null"] }
        type:
          oneOf:
            - $ref: "#/components/schemas/MemoryType"
            - type: "null"
        body: { type: [string, "null"] }
        baseVersion: { type: [integer, "null"], description: "The note's version the change was made against." }
        source: { type: string, enum: [chat, learn, import] }
        threadId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MemorySettings:
      type: object
      required: [mode, incognito]
      properties:
        mode: { $ref: "#/components/schemas/MemoryMode" }
        incognito: { type: boolean }

    MemoryImport:
      type: object
      required: [proposed, skipped, how]
      properties:
        proposed: { type: integer, description: Notes now waiting in the inbox. }
        skipped: { type: integer, description: "Notes left out: invalid, or the inbox was full." }
        how:
          type: string
          enum: [files, text, whole]
          description: "files: front matter read as is; text: the model sorted plain text; whole: the model wasn't available, so the text is one note."

    SharedScope:
      type: string
      enum: [workspace, node, group]
    SharedMode:
      type: string
      enum: [auto, manual, "off"]

    SharedTarget:
      type: object
      description: "A place for shared memory: the workspace, a knowledge node (`nodeId`) or a group (`groupId`)."
      required: [scope]
      properties:
        scope: { $ref: "#/components/schemas/SharedScope" }
        nodeId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }

    SharedPlace:
      type: object
      required: [scope, nodeId, groupId, label]
      properties:
        scope: { $ref: "#/components/schemas/SharedScope" }
        nodeId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }
        label: { type: string, description: "\"Workspace\", the node's or the group's name." }

    SharedSummary:
      type: object
      required: [id, name, description, type, version, place, canEdit, mode, myMode, everyoneMode, updatedAt, pack]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        version: { type: integer }
        place: { $ref: "#/components/schemas/SharedPlace" }
        canEdit: { type: boolean, description: "You can edit it, set it for everyone, and decide its proposals." }
        mode: { $ref: "#/components/schemas/SharedMode" }
        myMode:
          oneOf:
            - $ref: "#/components/schemas/SharedMode"
            - type: "null"
        everyoneMode: { $ref: "#/components/schemas/SharedMode" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        pack:
          description: Installed from a memory pack, read-only until the pack is forked.
          oneOf:
            - type: object
              required: [installId, name, version]
              properties:
                installId: { type: string }
                name: { type: string }
                version: { type: integer }
            - type: "null"

    SharedNote:
      allOf:
        - $ref: "#/components/schemas/SharedSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    SharedVersion:
      type: object
      required: [version, description, type, body, changedBy, changedAs, createdAt]
      properties:
        version: { type: integer }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }
        changedBy: { type: [string, "null"] }
        changedAs: { $ref: "#/components/schemas/MemoryAuthor" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    SharedProposal:
      type: object
      required: [id, op, place, memoryId, name, description, type, body, baseVersion, author, authorType, mine,
                 canDecide, threadId, reason, createdAt]
      properties:
        id: { type: string }
        op: { type: string, enum: [add, update, delete] }
        place: { $ref: "#/components/schemas/SharedPlace" }
        memoryId: { type: [string, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        type:
          oneOf:
            - $ref: "#/components/schemas/MemoryType"
            - type: "null"
        body: { type: [string, "null"] }
        baseVersion: { type: [integer, "null"] }
        author: { type: [string, "null"], description: "The person, or the person Claude was working for." }
        authorType: { $ref: "#/components/schemas/MemoryAuthor" }
        mine: { type: boolean }
        canDecide: { type: boolean }
        threadId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    SharedTargetPlace:
      allOf:
        - $ref: "#/components/schemas/SharedPlace"
        - type: object
          required: [canEdit]
          properties:
            canEdit: { type: boolean }

    PackNote:
      type: object
      required: [name, description, type, body]
      properties:
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }

    PackVersion:
      type: object
      required: [version, description, notes, flags, publishedBy, publishedAt, verified, yanked, yankReason]
      properties:
        version: { type: integer }
        description: { type: string }
        notes: { type: integer }
        flags:
          type: array
          items: { $ref: "#/components/schemas/ScanFlag" }
        publishedBy: { type: [string, "null"] }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }

    PackListing:
      type: object
      required: [name, owner, mine, latest, updatedAt]
      properties:
        name: { type: string }
        owner: { type: [string, "null"] }
        mine: { type: boolean }
        latest:
          description: "The newest version that isn't yanked; null when all are."
          oneOf:
            - $ref: "#/components/schemas/PackVersion"
            - type: "null"
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    PackDetail:
      allOf:
        - $ref: "#/components/schemas/PackListing"
        - type: object
          required: [versions, version, notes, isAdmin]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/PackVersion" }
            version: { $ref: "#/components/schemas/PackVersion" }
            notes:
              type: array
              items: { $ref: "#/components/schemas/PackNote" }
            isAdmin: { type: boolean }

    PackInstall:
      type: object
      required: [id, name, version, latest, place, canEdit, notes, installedAt]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        latest: { type: [integer, "null"], description: "A newer version that isn't yanked, if any." }
        place: { $ref: "#/components/schemas/SharedPlace" }
        canEdit: { type: boolean }
        notes: { type: integer }
        installedAt: { $ref: "#/components/schemas/Timestamp" }

    MemoryOverview:
      allOf:
        - $ref: "#/components/schemas/MemorySettings"
        - type: object
          required: [notes, inbox, shared, sharedProposals, targets, installs, types, limits]
          properties:
            notes:
              type: array
              description: Your notes, archived ones last.
              items: { $ref: "#/components/schemas/MemorySummary" }
            inbox:
              type: array
              items: { $ref: "#/components/schemas/InboxItem" }
            shared:
              type: array
              items: { $ref: "#/components/schemas/SharedSummary" }
            sharedProposals:
              type: array
              description: Open proposals you decide or made.
              items: { $ref: "#/components/schemas/SharedProposal" }
            targets:
              type: array
              description: The places you can share to.
              items: { $ref: "#/components/schemas/SharedTargetPlace" }
            installs:
              type: array
              description: Packs installed in places you read.
              items: { $ref: "#/components/schemas/PackInstall" }
            types:
              type: array
              items: { $ref: "#/components/schemas/MemoryType" }
            searchSentTo:
              type: string
              description: |
                Present when the deployment embeds text with an outside API (`EMBEDDING_BASE_URL`):
                that API's host. Claude's `memory_search` then sends the text of your notes there.
                Absent when the embedding model runs on the server, or search by meaning is off.
            limits:
              type: object
              required: [notes, body, description, index]
              properties:
                notes: { type: integer }
                body: { type: integer }
                description: { type: integer }
                index: { type: integer }

    DeletedFlag:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }
