openapi: 3.1.0
info:
  title: knowledge-chatroom storage API
  version: 0.3.0
  description: |
    The storage API served by the Python API server (services/api-py/api_py/storage_routes.py):
    workspace files, the knowledge tree, experiments, search, proposals, chat
    history and access; and the rest of that server's HTTP routes: memory
    (services/api-py/api_py/memory_routes.py), skills and the skill hub (services/api-py/api_py/skills_routes.py), the "+" menu's tools
    (services/api-py/api_py/tools.py), follow-up suggestions, the identity public key
    and the health check. The API server's answers are checked against it
    (issue #169). The chat run itself (`POST /`) is
    an AG-UI endpoint, specified by AG-UI rather than here.

    This file is the source of truth. `pnpm -C packages/contracts openapi` turns it
    into src/generated/storage-api.ts; CI fails when that file is out of date.

    Who is asking:
    - Without login (no AUTH_SECRET): every request is the local user, and no header is needed.
    - With login: the Next.js server sends `X-Knowledge-User`, a signed identity token
      (packages/contracts/src/identity-token.ts).
    - An outside service (an MCP server, a remote agent backend) sends `X-Knowledge-Storage`
      instead: Claude acting for that user. It can't reach /chats or manage access, writes
      in a knowledge node only with `?propose`, and doesn't rename, delete, review proposals,
      share or archive experiments, or upload them. Such requests answer 403 with the reason.
      Storage tokens only reach the storage routes: the skills, hub, tools, memory and
      follow-up routes take `X-Knowledge-User` alone (or nothing without login).

    Which workspace (issue #226, docs/workspaces.md): every storage, memory and skills
    request runs in one workspace, named by its id in any of
    - the `X-Knowledge-Workspace` header (the app's requests),
    - the `workspace` query parameter (EventSource and plain links, which can't set headers),
    - the `ws` claim of a storage or memory token, set when the token is minted.
    All that are present must name the same workspace, or the answer is 400. None at all
    means the default workspace, until a cut-off release named in the CHANGELOG; a token
    without a `ws` claim counts as naming the default workspace. A workspace that doesn't
    exist, isn't a UUID or that the user isn't a member of answers 404, the same for all
    three; so does any node, experiment, file, grant, group, proposal or chat of another
    workspace. Membership is checked on every request, and a watch stream ends once it is
    gone. The routes the TypeScript server still serves (the chat run, outside MCP servers'
    /memory/agent) answer 400 for any workspace but the default one, for now.

    Errors are JSON `{error}` with a 4xx or 5xx status. When storage isn't ready:
    503 = starting (try again shortly), 500 = failed to start, 404 = not configured.
servers:
  - url: http://localhost:8000
    description: The API server, api-py (LOCAL_AGENT_URL); the browser reaches it through /api/files on the Next.js app.
security:
  - {}
  - user: []
  - storage: []
tags:
  - name: files
  - name: nodes
  - name: experiments
  - name: runs
  - name: search
  - name: proposals
  - name: chats
  - name: access
  - name: workspaces
  - name: platform
  - name: skills
  - name: hub
  - name: memory
  - name: tools
  - name: server

paths:
  /files:
    get:
      tags: [files]
      operationId: listFiles
      summary: List live files, or watch changes
      description: |
        Without `watch`: the live files of one place (the workspace root, a node or an
        experiment). With `watch`: a Server-Sent Events stream with one `data: <WorkspaceEvent>`
        line per committed change the user may see, a `: watching` comment first and a
        `: ping` comment every 25 seconds. `node` and `experiment` don't narrow the stream.
      parameters:
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/Experiment"
        - name: watch
          in: query
          description: Present (any value) for the change stream.
          schema: { type: string }
      responses:
        "200":
          description: The files, or the change stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
            text/event-stream:
              schema:
                type: string
                description: "Lines of `data: <WorkspaceEvent JSON>` separated by blank lines."
              x-event-schema: { $ref: "#/components/schemas/WorkspaceEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /files/{path}:
    parameters:
      - $ref: "#/components/parameters/FilePath"
      - $ref: "#/components/parameters/Node"
      - $ref: "#/components/parameters/Experiment"
    get:
      tags: [files]
      operationId: readFile
      summary: Read a file's bytes, or its version history
      description: |
        Without `versions`: the file's bytes, typed by its mime, served with
        `Content-Security-Policy: sandbox` and `X-Content-Type-Options: nosniff`. A binary file
        answers 302 to a short-lived store link when S3_PUBLIC_URL is set. With `versions`: the
        version history, newest first. With `version`: that version's bytes, the same way, when it
        is one of this live file's own versions (any other id is a 404, as a missing file).
        `versions` and `version` together are a 400. A maintainer's or collaborator's agent reading
        a running run's models/general_rules.md (storage token) is recorded as one of its reads.
      parameters:
        - name: versions
          in: query
          description: Present (any value) for the version history.
          schema: { type: string }
        - name: version
          in: query
          description: A version id from the history, to read that version.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: The ETag from an earlier read; a match answers 304.
          schema: { type: string }
      responses:
        "200":
          description: The bytes, or the history.
          headers:
            ETag:
              description: The file's sha256 in quotes.
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
            X-File-Author:
              schema: { $ref: "#/components/schemas/AuthorType" }
          content:
            application/json:
              # Any JSON, not anyOf [VersionList, {}]: a stored document that happens to have
              # a `versions` array would otherwise parse as a VersionList and lose its other fields.
              schema:
                description: |
                  With `versions`, a VersionList (#/components/schemas/VersionList): parse it as
                  one when you asked for the history. Without it, a stored .json file's own
                  content, which can be any JSON.
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: A binary file, from the object store.
          headers:
            Location:
              schema: { type: string, format: uri }
        "304":
          description: Unchanged since the ETag sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    put:
      tags: [files]
      operationId: writeFile
      summary: Create or replace a file, or propose new content for it
      description: |
        The body is the file's bytes; Content-Type is its mime (optional; leave it out or send
        application/octet-stream to have it guessed). With `propose`, the content becomes a
        proposal for an editor to accept (see /proposals) and the answer is 201; a viewer may
        propose too. An experiment's files can't be proposed this way (400): promote the
        experiment instead. Bodies over MAX_UPLOAD_BYTES answer 413.

        To save over what you read and nothing newer, send `If-Match` with the ETag of your read:
        when someone else has saved since (or deleted the file), the answer is 412 with `changed`
        and the file's `sha256` now, and nothing is written.
      parameters:
        - name: propose
          in: query
          description: Present (any value) to propose the content instead of writing it.
          schema: { type: string }
        - name: note
          in: query
          description: With `propose`, why.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: "`*` only creates: 412 when the file exists."
          schema: { type: string, enum: ["*"] }
        - name: If-Match
          in: header
          description: |
            The version the write may replace: the file's ETag (its sha256, quoted or bare), several
            separated by commas, or `*` for any version of a file that exists. 412 when the file is
            another version now, or isn't there.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "201":
          description: Proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/ExistsOrChanged" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [files]
      operationId: renameFile
      summary: Rename (move) a file within the same place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: The new path. }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Exists" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file (soft delete; its history stays)
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string, description: The path. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes:
    get:
      tags: [nodes]
      operationId: getTree
      summary: The knowledge tree as the user sees it
      responses:
        "200":
          description: The levels, the user's role at the root, and the nodes they can see.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tree" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [nodes]
      operationId: createNode
      summary: Add a node one level below its parent
      description: Needs editor on the parent (the workspace root for a top-level node). Whoever adds a node owns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId, name]
              properties:
                parentId: { type: [string, "null"], description: null for a top-level node. }
                name: { type: string }
      responses:
        "201":
          description: The new node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeNode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [nodes]
      operationId: getNode
      summary: One node and the path to it
      responses:
        "200":
          description: The node, and its lineage from the top level down to it.
          content:
            application/json:
              schema:
                type: object
                required: [node, lineage]
                properties:
                  node: { $ref: "#/components/schemas/KnowledgeNode" }
                  lineage:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeNode" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [nodes]
      operationId: renameNode
      summary: Rename a node (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The renamed node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeNode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [nodes]
      operationId: deleteNode
      summary: Delete a node with everything below it (owner; soft delete)
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes/{id}/access:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [nodes]
      operationId: getNodeAccess
      summary: Who can open a node, and why
      description: >-
        Everyone who can open the node, with their role and every source of it: a grant here,
        on an ancestor or on the root, directly or through a group. Sources above a restricted
        node don't count. Needs Full access on the node, or an Owner or Admin who sees it in
        the tree (docs/restricted-knowledge.md). Storage tokens can't ask (403).
      responses:
        "200":
          description: The people, strongest source first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeAccess" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes/{id}/restriction:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [nodes]
      operationId: getNodeRestriction
      summary: Whether a node is restricted, and what switching it would change
      description: >-
        For an open node, who would lose access (or keep less) if it were restricted; for a
        restricted one, who would gain access if it were lifted. Needs Full access on the node.
        Storage tokens can't ask (403).
      responses:
        "200":
          description: The node's restriction and the preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restriction" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    put:
      tags: [nodes]
      operationId: setNodeRestriction
      summary: Restrict a node, or lift it (Full access)
      description: >-
        Restricting stops grants on its ancestors and on the root from reaching it. Each user or
        group in `keep` (from the preview's changes or groups) gets a grant on the node at the
        role they had, and the caller gets Full access, in the same transaction. Nobody else is
        kept. Audited as node.restrict or node.unrestrict, and sent as a node event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restricted]
              properties:
                restricted: { type: boolean }
                keep:
                  type: array
                  description: Users and groups who would lose access and keep their role there.
                  items:
                    type: object
                    required: [principalType, principalId]
                    properties:
                      principalType: { type: string, enum: [user, group] }
                      principalId: { type: string }
      responses:
        "200":
          description: The node's restriction now, and what switching it back would change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restriction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes/{id}/takeover:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [nodes]
      operationId: takeOverNode
      summary: Take a restricted node over (workspace Owners)
      description: >-
        Gives the calling Owner Full access on a restricted node, marked as a takeover so
        everyone with access sees it. Audited as node.takeover. 400 for a node that isn't
        restricted.
      responses:
        "200":
          description: Who can open the node now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeAccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments:
    get:
      tags: [experiments]
      operationId: listExperiments
      summary: Experiments the user can see
      parameters:
        - name: node
          in: query
          description: A node id for that node's, `root` for those at the workspace root; leave it out for all.
          schema: { type: string }
        - name: deleted
          in: query
          description: >-
            `1` lists instead the deleted experiments you may restore, newest deletion first, each
            with `deletedAt`, `deletedBy` and `restorable`: your own, and as an Owner or Admin the
            shared and archived ones too. Not with `node`; storage tokens can't ask (403).
          schema: { type: string, enum: ["1", "true", ""] }
      responses:
        "200":
          description: The experiments.
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    items: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [experiments]
      operationId: createExperiment
      summary: Start a draft experiment
      description: On a node it starts with a copy of the node's files; at the root (nodeId null) it starts empty. A run is an experiment with a report.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [nodeId, title]
                  properties:
                    nodeId: { type: [string, "null"] }
                - $ref: "#/components/schemas/ExperimentInput"
      responses:
        "201":
          description: The new experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/upload:
    post:
      tags: [experiments]
      operationId: uploadExperiment
      summary: Upload a new experiment with its files
      description: |
        A new draft experiment and its files in one request, all or nothing: the nodes it adds,
        the experiment and its files are written in one transaction.

        - `meta.id` is the experiment's id, chosen by the caller; 409 when any experiment, deleted
          or not, has had it.
        - `meta.path` names a knowledge node at every level, top level first (tech › module › loop ›
          process). An empty name, or null in the list form, means a node called `None`
          (`"Etch/Module 3//"`). Names match ignoring case. Nodes that don't exist yet are added,
          which needs editor access where the first one goes; an existing path needs viewer access.
        - Every part but `meta` is a file, its field name the file's path in the experiment. The
          experiment holds only these files, not a copy of its node's.

        Each file may be at most MAX_UPLOAD_BYTES (413 as soon as one is over, while the body
        streams in) and `meta` at most 256 KiB; there is no limit on the number of files or
        their total size. A new experiment is a draft: `status` is ignored. Storage tokens get 403.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta: { $ref: "#/components/schemas/ExperimentUploadMeta" }
              additionalProperties:
                type: string
                format: binary
                description: One file; its field name is its path in the experiment, e.g. `data/metrics.csv`.
            encoding:
              meta: { contentType: "application/json, text/plain" }
      responses:
        "201":
          description: The new experiment, where it sits, the nodes added for it and its files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405":
          description: Only POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ExperimentExists" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: The body isn't multipart/form-data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/import:
    post:
      tags: [experiments]
      operationId: importFolderAsExperiment
      summary: Make an experiment of a folder already in the workspace
      description: >-
        Copies the folder's files into a new experiment at `destination` (default: the folder's
        node), at their paths relative to the folder, sharing their stored bytes, so nothing is
        sent again; each starts a history of its own. Its planned parameters come from a
        params.json at the folder's top. Reading the folder needs view access where it is, and
        the experiment needs view access at the destination. `move` also deletes the files it
        imported (soft delete, in the same transaction), and only those: files left out stay, and
        one changed since the folder was listed stops the import (412, `changed`), so nothing is
        imported or deleted. `pointer` leaves an EXPERIMENT.md in it
        naming the experiment and linking to it: both need edit access where the folder is. A
        folder in a restricted node imported to outside that node needs Full access on it.
        Files larger than an upload may be are left out (`skipped`). With `preview`, answers
        what it would do and changes nothing. Storage tokens can't.
      parameters:
        - name: preview
          in: query
          description: 1 (or true, or empty) to see what it would do.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [node, folder]
              properties:
                node: { type: [string, "null"], description: The folder's node; null for the workspace root. }
                folder: { type: string, minLength: 1 }
                destination: { type: [string, "null"], description: Where the experiment goes; the folder's node when left out. }
                title: { type: string, maxLength: 200, description: The folder's name when left out. }
                hypothesis: { type: string }
                status: { type: string, enum: [draft, shared], default: draft }
                move: { type: boolean, default: false }
                pointer: { type: boolean, default: false }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderImport" }
        "201":
          description: The experiment, with what was imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderImport" }
        "412": { $ref: "#/components/responses/ExistsOrChanged" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [experiments]
      operationId: getExperiment
      summary: One experiment
      responses:
        "200":
          description: The experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [experiments]
      operationId: updateExperiment
      summary: Change an experiment (its maintainer and collaborators)
      description: >-
        Only its maintainer changes the status (shares, archives or restores it). A state of done
        or failed ends a run as POST /experiments/{id}/finish without `run` does, so it doesn't
        end a run someone else started (409). A running experiment isn't marked ready (409): its
        run ends by finishing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentInput" }
      responses:
        "200":
          description: The changed experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "409": { $ref: "#/components/responses/RunRunning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [experiments]
      operationId: deleteExperiment
      summary: Delete an experiment with its files (soft delete; its maintainer)
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/runs:
    post:
      tags: [experiments]
      operationId: startRun
      deprecated: true
      summary: Start a run, or run an earlier one again
      description: >-
        Deprecated: start a run with POST /experiments/{id}/runs (a new experiment with POST /experiments). It still works for this release and makes Run 1 of the new experiment.
        A new run: a draft experiment in state running, on a node with a copy of its files or at the
        root (nodeId null or left out) empty, with each of `inputs` copied under inputs/ at its
        current version, and a report.md whose front matter records where it came from.
        `provenance` is what the caller says about it (e.g. chat, model, skill, tools; 400 when one of
        these has another shape); who started it, when, the input versions, rerunOf and finishedAt
        are the server's. With `rerunOf`, that run again as a
        new one: its place, title, hypothesis and params unless given here, and its inputs read from
        its inputs/ at the content its record names, even if they were edited since (400 when one is
        gone or the record doesn't say). `inputs` instead reads those files at their current
        versions. Finish it with /finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: [string, "null"]
                  description: The node to fork; null or left out for the workspace root (with rerunOf, the old run's place).
                title: { type: string, maxLength: 200, description: "Required unless rerunOf." }
                hypothesis: { type: string }
                params: { type: object, additionalProperties: true }
                inputs:
                  type: array
                  items: { $ref: "#/components/schemas/RunInputSource" }
                rerunOf: { type: string, description: The run to run again. }
                provenance: { $ref: "#/components/schemas/CallerProvenance" }
      responses:
        "201":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [experiments]
      operationId: finishRun
      deprecated: true
      summary: Record a run's results and how it ended
      description: >-
        Deprecated: use POST /runs/{id}/finish. It still works for this release.
        Sets results (replacing the old ones whole) and state done or failed, and refreshes the
        record in its report.md front matter. Its maintainer and collaborators, while it isn't archived. A finished
        run stays as it ended: the same call again answers it unchanged, a different one is refused.
        The run it ends is `run` when given. Without it, a call that repeats how the caller's latest
        finished run ended is a retry, answered without change even while a newer run runs;
        otherwise it ends the running run only when the caller started it, and a 409 names a run
        someone else started, which keeps running. A PATCH to state done or failed follows the same rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results: { type: object, additionalProperties: true }
                state: { type: string, enum: [done, failed], default: done }
                run: { type: string, format: uuid, description: The run it ends. }
      responses:
        "200":
          description: The experiment, as it is after the finish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "409": { $ref: "#/components/responses/RunRunning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [experiments]
      operationId: restoreExperiment
      summary: Undo an experiment's delete
      description: >-
        Brings back a deleted experiment and the files deleted with it (files deleted before it
        stay deleted), with its status and state. Its maintainer can, and an Owner or Admin for one
        that isn't a draft; one you may not restore is not found. If its maintainer has left the
        workspace, the Owner or Admin restoring it becomes its maintainer. Storage tokens can't.
      responses:
        "200":
          description: The experiment, restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Its node was deleted too, so it can't be restored on its own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/reads:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [experiments]
      operationId: listRunReads
      deprecated: true
      summary: The Rules versions a run's agents read while it ran
      description: >-
        Deprecated: use GET /runs/{id}/reads. It still works for this release and answers the latest live run's reads.
        Each version of the run's models/general_rules.md that an agent or tool of its maintainer or
        a collaborator read through a storage token while the run was running, first read first; one
        entry per version. For whoever can see the run.
      responses:
        "200":
          description: The reads.
          content:
            application/json:
              schema:
                type: object
                required: [reads]
                properties:
                  reads:
                    type: array
                    items: { $ref: "#/components/schemas/RunRead" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/inputs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [experiments]
      operationId: addRunInputs
      deprecated: true
      summary: Link files into an experiment as inputs
      description: >-
        Deprecated: pass inputs to POST /experiments/{id}/runs. It still works for this release and adds to the running run's inputs. Each file is linked under inputs/ and recorded in the experiment's provenance. Its maintainer and collaborators, while it isn't archived or a finished run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: array
                  items: { $ref: "#/components/schemas/RunInputSource" }
      responses:
        "200":
          description: The experiment, with the inputs added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/maintainer:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [experiments]
      operationId: handOverExperiment
      summary: Hand an experiment over to another member
      description: |
        Its maintainer can, and an Owner or Admin of the workspace once it isn't a draft
        (docs/workspaces.md, "Experiment handover"). The new maintainer must be a member
        who can view its node (400 otherwise). The previous maintainer stays on as a
        collaborator unless keepAsCollaborator is false, but only while they are still a
        member. Its author never changes. Storage tokens can't (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                keepAsCollaborator: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/ExperimentIfVisible" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/collaborators/{userId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: userId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [experiments]
      operationId: addExperimentCollaborator
      summary: Add a collaborator (its maintainer)
      description: |
        They must be a member who can view its node (400 otherwise). Collaborators edit it
        while it isn't archived and see it while it is a draft; they don't change its
        status, delete it or choose who works on it. Storage tokens can't (403).
      responses:
        "200": { $ref: "#/components/responses/ExperimentIfVisible" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [experiments]
      operationId: removeExperimentCollaborator
      summary: Remove a collaborator (its maintainer), or stop collaborating (your own id)
      description: Storage tokens can't (403).
      responses:
        "200": { $ref: "#/components/responses/ExperimentIfVisible" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [runs]
      operationId: listExperimentRuns
      summary: An experiment's runs, newest first
      description: >-
        Its live runs, for whoever can see it. With `archived`, the archived ones too. With
        `deleted`, only its deleted ones (with deletedAt and deletedBy), for its maintainer and
        collaborators; storage tokens can't ask for those. `archived` and `deleted` together are a 400.
      parameters:
        - $ref: "#/components/parameters/Archived"
        - name: deleted
          in: query
          description: 1 (or true, or empty) for the deleted runs.
          schema: { type: string }
      responses:
        "200":
          description: The runs, without their file records.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [runs]
      operationId: startExperimentRun
      summary: Start another run of an experiment
      description: >-
        A new run, numbered after the experiment's last, with the experiment's planned parameters
        unless `params` is given. `inputs` are linked under inputs/ at their current versions and
        recorded in its provenance, as for /experiments/runs. Its maintainer and collaborators,
        while it isn't archived; storage tokens can. Only one run of an experiment runs at a
        time, since its runs share the working files: 409 names the one running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 200 }
                params: { type: object, additionalProperties: true }
                inputs:
                  type: array
                  items: { $ref: "#/components/schemas/RunInputSource" }
                provenance: { $ref: "#/components/schemas/CallerProvenance" }
      responses:
        "201":
          description: The run, running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunRunning" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs:
    get:
      tags: [runs]
      operationId: compareRuns
      summary: Runs to compare, with each one's experiment
      description: >-
        Live runs of experiments you can see, newest first: on a node (`node=root` for the
        workspace root), with `descendants` also on the nodes under it, of one `experiment`, or
        anywhere when neither is given. Archived runs only with `archived`.
      parameters:
        - name: node
          in: query
          description: A node id, or root.
          schema: { type: string }
        - name: descendants
          in: query
          description: 1 (or true, or empty) to take in the nodes under `node`.
          schema: { type: string }
        - name: experiment
          in: query
          description: Only this experiment's runs.
          schema: { type: string }
        - $ref: "#/components/parameters/Archived"
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/ComparedRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [runs]
      operationId: getRun
      summary: One run, with its file record
      description: For whoever can see its experiment; a deleted run is not found here.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [runs]
      operationId: updateRun
      summary: Change a run's label, or archive it
      description: >-
        Its experiment's maintainer and collaborators, while the experiment isn't archived. A
        finished run's label and archiving can still change. Storage tokens can change the label
        but not archive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                label: { type: string, maxLength: 200 }
                archived: { type: boolean }
      responses:
        "200":
          description: The run, changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a finished run (soft delete)
      description: >-
        Its experiment's maintainer and collaborators, while the experiment isn't archived; storage
        tokens can't. Restore brings it back. A running run can't be deleted (409): finish it first.
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run is still running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [runs]
      operationId: finishRunById
      summary: Record a run's results and how it ended
      description: >-
        Sets its results and state done or failed, and takes its file record: every file of the
        experiment as it is now (path, version, sha256, size). Its experiment's maintainer and
        collaborators, while it isn't archived; storage tokens can. A finished run stays as it
        ended: the same call again answers it unchanged, a different one is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              additionalProperties: false
              properties:
                results: { type: object, additionalProperties: true }
                state: { type: string, enum: [done, failed], default: done }
      responses:
        "200":
          description: The run, finished, with its file record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/rerun:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [runs]
      operationId: rerunRun
      summary: Run a run again
      description: >-
        With `experiment` set to the run's own experiment: another run of it, with this run's
        parameters and label (its maintainer and collaborators; 409 while one is running). With
        `experiment` null, left out, or no body: Run 1 of a new draft experiment of yours, for
        whoever can see this one, as /experiments/runs with rerunOf does. Either way the new run's
        provenance has rerunOf {id, run} naming this one. Any other experiment is a 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                experiment: { type: [string, "null"] }
      responses:
        "201":
          description: The new run, running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunRunning" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [runs]
      operationId: restoreRun
      summary: Undo a run's delete
      description: Its experiment's maintainer and collaborators, while it isn't archived; storage tokens can't.
      responses:
        "200":
          description: The run, restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/reads:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [runs]
      operationId: listReadsOfRun
      summary: The Rules versions a run's agents read while it ran
      description: As /experiments/{id}/reads, for this run. For whoever can see its experiment.
      responses:
        "200":
          description: The reads.
          content:
            application/json:
              schema:
                type: object
                required: [reads]
                properties:
                  reads:
                    type: array
                    items: { $ref: "#/components/schemas/RunRead" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/files:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [runs]
      operationId: listRunFiles
      summary: A run's file record
      description: >-
        Every file of its experiment as it was when the run finished; empty while it runs.
        `taken` says when the record was taken: finish, or migration for a run that finished
        before runs had records (what changed after it ended can't be told apart).
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema:
                type: object
                required: [files, taken]
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/RunFile" }
                  taken: { $ref: "#/components/schemas/RunRecordTaken" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /runs/{id}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/FilePath"
    get:
      tags: [runs]
      operationId: readRunFile
      summary: A file's bytes as the run recorded them
      description: >-
        The recorded version's bytes, with the checks of reading the experiment's files, served
        as /files/{path} serves them (sandboxed, nosniff). A recorded version never changes, so it
        may be cached for good, and stays readable after the working file is deleted, renamed or
        replaced. 404 when the record has no such path.
      parameters:
        - name: If-None-Match
          in: header
          description: The ETag from an earlier read; a match answers 304.
          schema: { type: string }
      responses:
        "200":
          description: The bytes.
          headers:
            ETag:
              description: The version's sha256 in quotes.
              schema: { type: string }
            X-File-Author:
              schema: { $ref: "#/components/schemas/AuthorType" }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: Unchanged since the ETag sent.
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Files the user can read whose text or path matches, best first
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: A node id; only that node, the nodes below it and their experiments.
          schema: { type: string }
        - name: near
          in: query
          description: A node id; files near it rank first.
          schema: { type: string }
        - name: experiment
          in: query
          description: An experiment id; its files rank first.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /proposals:
    get:
      tags: [proposals]
      operationId: listProposals
      summary: Proposed versions the user can see, newest first
      description: Open proposals on files the user can read, and their own.
      parameters:
        - name: node
          in: query
          description: A node id for one node's, `root` (or empty) for the workspace root's.
          schema: { type: string }
        - name: experiment
          in: query
          description: Those promoted from this experiment.
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, accepted, rejected, withdrawn, all]
            default: open
      responses:
        "200":
          description: The proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [proposals]
      operationId: promoteExperiment
      summary: Propose an experiment's changed files to its node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentId]
              properties:
                experimentId: { type: string }
                paths:
                  description: Only these files; all changed files when left out.
                  type: array
                  items: { type: string }
                note: { type: string }
      responses:
        "201":
          description: The proposals made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /proposals/promotable:
    get:
      tags: [proposals]
      operationId: listPromotable
      summary: What promoting an experiment would propose
      parameters:
        - name: experiment
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/Promotable" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /proposals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [proposals]
      operationId: getProposal
      summary: One proposal
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /proposals/{id}/content:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [proposals]
      operationId: getProposalContent
      summary: The proposed bytes
      description: Typed by the proposal's mime, with the same sandbox headers as a file read.
      responses:
        "200":
          description: The bytes.
          headers:
            ETag:
              description: The proposed content's sha256 in quotes; what an accept sends as `sha256`.
              schema: { type: string }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /proposals/{id}/{decision}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: decision
        in: path
        required: true
        description: accept and reject need editor on the proposal's place; withdraw is for its proposer.
        schema: { type: string, enum: [accept, reject, withdraw] }
    post:
      tags: [proposals]
      operationId: decideProposal
      summary: Accept, reject or withdraw a proposal
      description: |
        Accepting writes it as the file's next version, credited to its proposer. The proposer can
        revise an open proposal, and the file can change, while someone reviews it, so an accept
        can say what its reviewer looked at: with `sha256` or `base` in the body, the answer is 409
        (and nothing is written) when that isn't what would be accepted, or replaced, any more.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  type: string
                  description: For accept, the proposed content reviewed (the proposal's `sha256`).
                base:
                  type: [string, "null"]
                  description: |
                    For accept, the sha256 of the file the proposal was compared with; null when
                    there was no file. Left out, the file is replaced whatever it holds.
      responses:
        "200":
          description: The proposal, decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProposalChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /chats:
    get:
      tags: [chats]
      operationId: listChats
      summary: The user's chats, most recently active first
      description: Chats are their user's alone; workspace owners don't see them, and storage tokens can't reach them.
      parameters:
        - name: agent
          in: query
          schema: { type: string }
        - name: archived
          in: query
          description: Present (any value) to include archived chats.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: A previous page's nextCursor.
          schema: { type: string }
      responses:
        "200":
          description: One page of chats.
          content:
            application/json:
              schema:
                type: object
                required: [threads, nextCursor]
                properties:
                  threads:
                    type: array
                    items: { $ref: "#/components/schemas/ChatSummary" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /chats/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [chats]
      operationId: getChat
      summary: One of the user's chats, with its messages as of its latest run
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema:
                type: object
                required: [chat, messages]
                properties:
                  chat: { $ref: "#/components/schemas/ChatSummary" }
                  messages:
                    description: AG-UI messages.
                    type: array
                    items: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [chats]
      operationId: updateChat
      summary: Rename or archive a chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, "null"] }
                archived: { type: boolean }
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [chats]
      operationId: deleteChat
      summary: Delete a chat for good, with its runs
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /chats/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [chats]
      operationId: listChatRuns
      summary: A chat's runs, in order
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/ChatRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [chats]
      operationId: saveChatRun
      summary: Save a finished run, starting the chat on its first
      description: 403 when the id is someone else's chat. Bodies over 32 MiB answer 413.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, runId, events, messages]
              properties:
                agentId: { type: string }
                runId: { type: string }
                parentRunId: { type: [string, "null"] }
                events:
                  description: The run's AG-UI events.
                  type: array
                  items: {}
                messages:
                  description: The whole conversation after the run (AG-UI messages).
                  type: array
                  items: {}
                name:
                  description: The chat's name if it has none yet.
                  type: [string, "null"]
      responses:
        "201":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: The workspaces you belong to, the default one first
      parameters:
        - name: archived
          in: query
          description: "`true` adds the archived workspaces you own, after the active ones, so you can restore them."
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Your workspaces, with your role in each, and whether you may create one.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, canCreate]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
                  canCreate:
                    type: boolean
                    description: False when the server's WORKSPACE_CREATORS doesn't name you.
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace, with you as its Owner
      description: |
        You become its Owner, with Full access on its root, in the same transaction.
        Its slug is `slug` when given (409 when another workspace has it), otherwise
        one made from the name (a number is added when it is taken). Without
        `levels`, its knowledge levels are tech, module, loop and process; `[]` gives none.
        Storage tokens can't create workspaces (403), nor can people the server's
        WORKSPACE_CREATORS doesn't name, when it is set (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug:
                  type: string
                  maxLength: 48
                  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
                  description: The address in `/w/<slug>`; lower-case letters and digits in dash-separated runs.
                levels:
                  type: array
                  maxItems: 10
                  items: { type: string, minLength: 1 }
      responses:
        "201":
          description: The new workspace, with `role` owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Another workspace already has the slug asked for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /workspaces/{id}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: One of your workspaces
      description: An archived workspace answers only for its Owners; for everyone else it is 404.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The workspace, with your role there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename (Owners and Admins), archive or restore (Owners) a workspace
      description: |
        Renaming keeps the slug, so links keep working. Archiving hides the workspace from
        everyone: it leaves `GET /workspaces`, and every request, token and stream in it
        gets 404, until an Owner restores it (`status: active`). Nothing is deleted. The
        default workspace can't be archived (400). Each change is audited.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                status: { $ref: "#/components/schemas/WorkspaceStatus" }
      responses:
        "200":
          description: The workspace as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /workspaces/{id}/members:
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: The workspace's members
      description: |
        Names and roles for every member; email, sign-up and last-active times for Owners
        and Admins only. Never login subjects.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMember" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [workspaces]
      operationId: addWorkspaceMember
      summary: Add someone who has signed in, as Member or Admin (Owners and Admins)
      description: |
        Writes the membership and, unless `access` is none, a starting grant on the root,
        in one transaction (`access` defaults to viewer). Someone who is already a member
        is left as they are: 409 with their current role. The starting grant never
        replaces a grant they already have.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { type: string, enum: [member, admin] }
                access: { type: string, enum: [none, viewer, editor] }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    type: object
                    required: [id, role]
                    properties:
                      id: { type: string }
                      role: { $ref: "#/components/schemas/WorkspaceRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already a member; nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlreadyMember" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /workspaces/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: userId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [workspaces]
      operationId: changeWorkspaceMemberRole
      summary: Change a member's role (Owners; Admins in part)
      description: |
        Owners give any member any role. Admins can make a Member an Admin, and step down
        to Member themselves; nothing else (403). The last Owner can't be demoted (409).
        A role change never changes a grant. Transferring ownership is two changes: make
        the other person Owner, then lower your own role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "200":
          description: The member's role now.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    type: object
                    required: [id, role]
                    properties:
                      id: { type: string }
                      role: { $ref: "#/components/schemas/WorkspaceRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It would leave the workspace without an Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member, or leave (your own id)
      description: |
        Owners remove anyone, Admins remove Members only (403 otherwise), and anyone may
        leave. Nobody removes the last Owner, themselves included (409). In one
        transaction it deletes the membership, the person's direct grants in the
        workspace, their memberships of its groups and their places as an Experiment
        collaborator, and records the departure, so the
        default workspace doesn't add them back when they sign in. Their own drafts,
        chats and memory stay, private as before. From then on their requests, tokens and
        streams in the workspace get 404, and their runs there stop at the next tool call.
      responses:
        "200":
          description: Removed; how many direct grants, group memberships and collaborator places went with it.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: object
                    required: [grants, groups, collaborations]
                    properties:
                      grants: { type: integer }
                      groups: { type: integer }
                      collaborations: { type: integer }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: They are the workspace's last Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

