openapi: 3.1.0
info:
  title: knowledge-chatroom storage API
  version: 0.2.3
  description: |
    The storage API served by the agent server (apps/agent/src/storage/http.ts):
    workspace files, the knowledge tree, experiments, search, proposals, chat
    history and access; and the rest of that server's HTTP routes: memory
    (apps/agent/src/memory/http.ts), skills and the skill hub (apps/agent/src/skills/http.ts), the "+" menu's tools
    (apps/agent/src/tools-api.ts), follow-up suggestions, the identity public key
    and the health check. It is the contract a Python service has to match before
    it can take over a route group (issue #169). The chat run itself (`POST /`) is
    an AG-UI endpoint, specified by AG-UI rather than here.

    This file is the source of truth. `pnpm -C packages/contracts openapi` turns it
    into src/generated/storage-api.ts; CI fails when that file is out of date.

    Who is asking:
    - Without login (no AUTH_SECRET): every request is the local user, and no header is needed.
    - With login: the Next.js server sends `X-Knowledge-User`, a signed identity token
      (packages/contracts/src/identity-token.ts).
    - An outside service (an MCP server, a remote agent backend) sends `X-Knowledge-Storage`
      instead: Claude acting for that user. It can't reach /chats or manage access, writes
      in a knowledge node only with `?propose`, and doesn't rename, delete, review proposals,
      share or archive experiments, or upload them. Such requests answer 403 with the reason.
      Storage tokens only reach the storage routes: the skills, hub, tools, memory and
      follow-up routes take `X-Knowledge-User` alone (or nothing without login).

    Errors are JSON `{error}` with a 4xx or 5xx status. When storage isn't ready:
    503 = starting (try again shortly), 500 = failed to start, 404 = not configured.
servers:
  - url: http://localhost:8000
    description: The agent server (LOCAL_AGENT_URL); the browser reaches it through /api/files on the Next.js app.
security:
  - {}
  - user: []
  - storage: []
tags:
  - name: files
  - name: nodes
  - name: experiments
  - name: search
  - name: proposals
  - name: chats
  - name: access
  - name: skills
  - name: hub
  - name: memory
  - name: tools
  - name: server

paths:
  /files:
    get:
      tags: [files]
      operationId: listFiles
      summary: List live files, or watch changes
      description: |
        Without `watch`: the live files of one place (the workspace root, a node or an
        experiment). With `watch`: a Server-Sent Events stream with one `data: <WorkspaceEvent>`
        line per committed change the user may see, a `: watching` comment first and a
        `: ping` comment every 25 seconds. `node` and `experiment` don't narrow the stream.
      parameters:
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/Experiment"
        - name: watch
          in: query
          description: Present (any value) for the change stream.
          schema: { type: string }
      responses:
        "200":
          description: The files, or the change stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
            text/event-stream:
              schema:
                type: string
                description: "Lines of `data: <WorkspaceEvent JSON>` separated by blank lines."
              x-event-schema: { $ref: "#/components/schemas/WorkspaceEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /files/{path}:
    parameters:
      - $ref: "#/components/parameters/FilePath"
      - $ref: "#/components/parameters/Node"
      - $ref: "#/components/parameters/Experiment"
    get:
      tags: [files]
      operationId: readFile
      summary: Read a file's bytes, or its version history
      description: |
        Without `versions`: the file's bytes, typed by its mime, served with
        `Content-Security-Policy: sandbox` and `X-Content-Type-Options: nosniff`. A binary file
        answers 302 to a short-lived store link when S3_PUBLIC_URL is set. With `versions`: the
        version history, newest first.
      parameters:
        - name: versions
          in: query
          description: Present (any value) for the version history.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: The ETag from an earlier read; a match answers 304.
          schema: { type: string }
      responses:
        "200":
          description: The bytes, or the history.
          headers:
            ETag:
              description: The file's sha256 in quotes.
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
            X-File-Author:
              schema: { $ref: "#/components/schemas/AuthorType" }
          content:
            application/json:
              # Any JSON, not anyOf [VersionList, {}]: a stored document that happens to have
              # a `versions` array would otherwise parse as a VersionList and lose its other fields.
              schema:
                description: |
                  With `versions`, a VersionList (#/components/schemas/VersionList): parse it as
                  one when you asked for the history. Without it, a stored .json file's own
                  content, which can be any JSON.
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: A binary file, from the object store.
          headers:
            Location:
              schema: { type: string, format: uri }
        "304":
          description: Unchanged since the ETag sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    put:
      tags: [files]
      operationId: writeFile
      summary: Create or replace a file, or propose new content for it
      description: |
        The body is the file's bytes; Content-Type is its mime (optional; leave it out or send
        application/octet-stream to have it guessed). With `propose`, the content becomes a
        proposal for an editor to accept (see /proposals) and the answer is 201; a viewer may
        propose too. An experiment's files can't be proposed this way (400): promote the
        experiment instead. Bodies over MAX_UPLOAD_BYTES answer 413.
      parameters:
        - name: propose
          in: query
          description: Present (any value) to propose the content instead of writing it.
          schema: { type: string }
        - name: note
          in: query
          description: With `propose`, why.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: "`*` only creates: 412 when the file exists."
          schema: { type: string, enum: ["*"] }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "201":
          description: Proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Exists" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [files]
      operationId: renameFile
      summary: Rename (move) a file within the same place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: The new path. }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Exists" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file (soft delete; its history stays)
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string, description: The path. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes:
    get:
      tags: [nodes]
      operationId: getTree
      summary: The knowledge tree as the user sees it
      responses:
        "200":
          description: The levels, the user's role at the root, and the nodes they can see.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tree" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [nodes]
      operationId: createNode
      summary: Add a node one level below its parent
      description: Needs editor on the parent (the workspace root for a top-level node). Whoever adds a node owns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId, name]
              properties:
                parentId: { type: [string, "null"], description: null for a top-level node. }
                name: { type: string }
      responses:
        "201":
          description: The new node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeNode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [nodes]
      operationId: getNode
      summary: One node and the path to it
      responses:
        "200":
          description: The node, and its lineage from the top level down to it.
          content:
            application/json:
              schema:
                type: object
                required: [node, lineage]
                properties:
                  node: { $ref: "#/components/schemas/KnowledgeNode" }
                  lineage:
                    type: array
                    items: { $ref: "#/components/schemas/KnowledgeNode" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [nodes]
      operationId: renameNode
      summary: Rename a node (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The renamed node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeNode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [nodes]
      operationId: deleteNode
      summary: Delete a node with everything below it (owner; soft delete)
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments:
    get:
      tags: [experiments]
      operationId: listExperiments
      summary: Experiments the user can see
      parameters:
        - name: node
          in: query
          description: A node id for that node's, `root` for those at the workspace root; leave it out for all.
          schema: { type: string }
      responses:
        "200":
          description: The experiments.
          content:
            application/json:
              schema:
                type: object
                required: [experiments]
                properties:
                  experiments:
                    type: array
                    items: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [experiments]
      operationId: createExperiment
      summary: Start a draft experiment
      description: On a node it starts with a copy of the node's files; at the root (nodeId null) it starts empty. A run is an experiment with a report.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [nodeId, title]
                  properties:
                    nodeId: { type: [string, "null"] }
                - $ref: "#/components/schemas/ExperimentInput"
      responses:
        "201":
          description: The new experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/upload:
    post:
      tags: [experiments]
      operationId: uploadExperiment
      summary: Upload a new experiment with its files
      description: |
        A new draft experiment and its files in one request, all or nothing: the nodes it adds,
        the experiment and its files are written in one transaction.

        - `meta.id` is the experiment's id, chosen by the caller; 409 when any experiment, deleted
          or not, has had it.
        - `meta.path` names a knowledge node at every level, top level first (tech › module › loop ›
          process). An empty name, or null in the list form, means a node called `None`
          (`"Etch/Module 3//"`). Names match ignoring case. Nodes that don't exist yet are added,
          which needs editor access where the first one goes; an existing path needs viewer access.
        - Every part but `meta` is a file, its field name the file's path in the experiment. The
          experiment holds only these files, not a copy of its node's.

        Each file may be at most MAX_UPLOAD_BYTES (413 as soon as one is over, while the body
        streams in) and `meta` at most 256 KiB; there is no limit on the number of files or
        their total size. A new experiment is a draft: `status` is ignored. Storage tokens get 403.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta: { $ref: "#/components/schemas/ExperimentUploadMeta" }
              additionalProperties:
                type: string
                format: binary
                description: One file; its field name is its path in the experiment, e.g. `data/metrics.csv`.
            encoding:
              meta: { contentType: "application/json, text/plain" }
      responses:
        "201":
          description: The new experiment, where it sits, the nodes added for it and its files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405":
          description: Only POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/ExperimentExists" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415":
          description: The body isn't multipart/form-data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [experiments]
      operationId: getExperiment
      summary: One experiment
      responses:
        "200":
          description: The experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    patch:
      tags: [experiments]
      operationId: updateExperiment
      summary: Change an experiment (its author)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentInput" }
      responses:
        "200":
          description: The changed experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [experiments]
      operationId: deleteExperiment
      summary: Delete an experiment with its files (soft delete)
      responses:
        "200": { $ref: "#/components/responses/DeletedId" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/runs:
    post:
      tags: [experiments]
      operationId: startRun
      summary: Start a run, or run an earlier one again
      description: >-
        A new run: a draft experiment in state running, on a node with a copy of its files or at the
        root (nodeId null or left out) empty, with each of `inputs` linked read-only under inputs/ at
        its current version, and a report.md whose front matter records where it came from.
        `provenance` is what the caller says about it (e.g. chat, model, skill, tools; 400 when one of
        these has another shape); who started it, when, the input versions, rerunOf and finishedAt
        are the server's. With `rerunOf`, that run again as a
        new one: its place, title, hypothesis, params and the exact input versions it read, unless
        given here. Finish it with /finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: [string, "null"]
                  description: The node to fork; null or left out for the workspace root (with rerunOf, the old run's place).
                title: { type: string, maxLength: 200, description: "Required unless rerunOf." }
                hypothesis: { type: string }
                params: { type: object, additionalProperties: true }
                inputs:
                  type: array
                  items: { $ref: "#/components/schemas/RunInputSource" }
                rerunOf: { type: string, description: The run to run again. }
                provenance:
                  type: object
                  additionalProperties: true
                  description: >-
                    At most 16 KiB of JSON. startedBy, startedAt, finishedAt, inputs and rerunOf are
                    the server's and are dropped; other keys are kept as given.
                  properties:
                    chat: { type: [string, "null"] }
                    model: { type: [string, "null"] }
                    skill:
                      type: [object, "null"]
                      required: [name]
                      properties:
                        name: { type: string }
                        source: { type: string }
                        version: { type: number }
                        sha256: { type: string }
                    tools:
                      type: [object, "null"]
                      additionalProperties: { type: string }
                      description: Each tool's version, by name.
      responses:
        "201":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [experiments]
      operationId: finishRun
      summary: Record a run's results and how it ended
      description: >-
        Sets results (replacing the old ones whole) and state done or failed, and refreshes the
        record in its report.md front matter. Only its author, while it isn't archived. A finished
        run stays as it ended: the same call again answers it unchanged, a different one is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results: { type: object, additionalProperties: true }
                state: { type: string, enum: [done, failed], default: done }
      responses:
        "200":
          description: The run, finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /experiments/{id}/inputs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [experiments]
      operationId: addRunInputs
      summary: Link files into an experiment as inputs
      description: Each file is linked under inputs/ and recorded in the experiment's provenance. Only its author, while it isn't archived or a finished run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs:
                  type: array
                  items: { $ref: "#/components/schemas/RunInputSource" }
      responses:
        "200":
          description: The experiment, with the inputs added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Files the user can read whose text or path matches, best first
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: A node id; only that node, the nodes below it and their experiments.
          schema: { type: string }
        - name: near
          in: query
          description: A node id; files near it rank first.
          schema: { type: string }
        - name: experiment
          in: query
          description: An experiment id; its files rank first.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
