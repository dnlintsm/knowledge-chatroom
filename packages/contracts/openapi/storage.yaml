              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/import:
    post:
      tags: [memory]
      operationId: importMemory
      summary: Import notes into your inbox, from pasted text, a .md file or an export .zip
      security: [{}, {user: []}]
      description: |
        Notes with front matter (name, description, type) are read as they are; other text is
        sorted into notes by the model, or becomes one note when the model isn't available.
        Everything waits in the inbox. At most 2 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                label: { type: string, description: Where it came from, for the inbox. }
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What went to the inbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/notes/{name}:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    get:
      tags: [memory]
      operationId: getMemoryNote
      summary: A note and its versions
      security: [{}, {user: []}]
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                type: object
                required: [note, versions]
                properties:
                  note: { $ref: "#/components/schemas/MemoryNote" }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryVersion" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    put:
      tags: [memory]
      operationId: saveMemoryNote
      summary: Create or replace a note, as yours
      security: [{}, {user: []}]
      parameters:
        - name: create
          in: query
          description: "`1` or `true` refuses a name already in use (409)."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/MemoryNote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "409": { $ref: "#/components/responses/MemoryChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [memory]
      operationId: deleteMemoryNote
      summary: Delete a note for good, with its versions
      security: [{}, {user: []}]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [name, deleted]
                properties:
                  name: { type: string }
                  deleted: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/notes/{name}/restore:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    post:
      tags: [memory]
      operationId: restoreMemoryNote
      summary: Make an earlier version current (as a new version)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/MemoryNoteAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/notes/{name}/archive:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    post:
      tags: [memory]
      operationId: archiveMemoryNote
      summary: Archive a note, or bring it back
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                archived: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/MemoryNoteAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/events/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [memory]
      operationId: undoMemoryChange
      summary: "Undo one of Claude's changes, while it is the note's latest"
      security: [{}, {user: []}]
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema:
                type: object
                required: [name, note]
                properties:
                  name: { type: string }
                  note:
                    description: The note now; null when undoing removed it.
                    oneOf:
                      - $ref: "#/components/schemas/MemoryNote"
                      - type: "null"
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "409": { $ref: "#/components/responses/MemoryChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/shared:
    post:
      tags: [memory]
      operationId: shareMemoryNote
      summary: Share a note to the workspace, a knowledge node or a group
      security: [{}, {user: []}]
      description: Where you edit shared memory it becomes a note there; elsewhere a proposal for its editors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SharedTarget"
                - $ref: "#/components/schemas/MemoryInput"
                - type: object
                  required: [name]
                  properties:
                    name: { type: string }
      responses:
        "200":
          description: The new note, or the proposal.
          content:
            application/json:
              schema:
                type: object
                required: [note, proposal]
                properties:
                  note:
                    oneOf:
                      - $ref: "#/components/schemas/SharedNote"
                      - type: "null"
                  proposal:
                    oneOf:
                      - $ref: "#/components/schemas/SharedProposal"
                      - type: "null"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/shared/proposals/{id}/{decision}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: decision
        in: path
        required: true
        description: "accept or reject (its place's editors), withdraw (its author)."
        schema: { type: string, enum: [accept, reject, withdraw] }
    post:
      tags: [memory]
      operationId: decideSharedMemoryProposal
      summary: Accept, reject or withdraw a proposed change to shared memory
      security: [{}, {user: []}]
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, note]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [accept, reject, withdraw] }
                  note:
                    description: The note after an accepted change; otherwise null.
                    oneOf:
                      - $ref: "#/components/schemas/SharedNote"
                      - type: "null"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "409": { $ref: "#/components/responses/MemoryChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/shared/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [memory]
      operationId: getSharedMemoryNote
      summary: A shared note you read, and its versions
      security: [{}, {user: []}]
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                type: object
                required: [note, versions]
                properties:
                  note: { $ref: "#/components/schemas/SharedNote" }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/SharedVersion" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    put:
      tags: [memory]
      operationId: updateSharedMemoryNote
      summary: Change a shared note (its place's editors)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MemoryInput"
                - type: object
                  properties:
                    version: { type: integer, description: Refuse (409) if the note is past this version. }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/SharedNote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "409": { $ref: "#/components/responses/MemoryChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    delete:
      tags: [memory]
      operationId: deleteSharedMemoryNote
      summary: Delete a shared note for good (its place's editors)
      security: [{}, {user: []}]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/shared/{id}/mode:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [memory]
      operationId: setSharedMemoryMode
      summary: Set a shared note's mode for you, or for everyone (its place's editors)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  description: null clears your own choice.
                  oneOf:
                    - $ref: "#/components/schemas/SharedMode"
                    - type: "null"
                everyone: { type: boolean, default: false }
      responses:
        "200":
          description: The note as you now see it.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/SharedSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/packs:
    get:
      tags: [memory]
      operationId: listMemoryPacks
      summary: The hub's memory packs
      security: [{}, {user: []}]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The packs.
          content:
            application/json:
              schema:
                type: object
                required: [packs, isAdmin]
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/PackListing" }
                  isAdmin: { type: boolean }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }
    post:
      tags: [memory]
      operationId: publishMemoryPack
      summary: "Publish a place's own shared notes as a pack (its editors)"
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SharedTarget"
                - type: object
                  required: [name, description]
                  properties:
                    name: { type: string }
                    description: { type: string }
      responses:
        "200":
          description: Published (or `unchanged`).
          content:
            application/json:
              schema:
                type: object
                required: [name, version, unchanged]
                properties:
                  name: { type: string }
                  version: { type: integer }
                  unchanged: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/packs/{name}:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    get:
      tags: [memory]
      operationId: getMemoryPack
      summary: "A pack's versions, and one version's notes"
      security: [{}, {user: []}]
      parameters:
        - $ref: "#/components/parameters/HubVersion"
      responses:
        "200": { $ref: "#/components/responses/PackAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/packs/{name}/install:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    post:
      tags: [memory]
      operationId: installMemoryPack
      summary: Install a pack in a place, or move its install to a version (its editors)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SharedTarget"
                - type: object
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Installed.
          content:
            application/json:
              schema:
                type: object
                required: [install]
                properties:
                  install: { $ref: "#/components/schemas/PackInstall" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "409": { $ref: "#/components/responses/MemoryChanged" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/packs/{name}/verify:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    post:
      tags: [memory]
      operationId: verifyMemoryPack
      summary: Mark a version checked, or not (hub admins)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                verified: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/PackAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/packs/{name}/yank:
    parameters:
      - $ref: "#/components/parameters/MemoryName"
    post:
      tags: [memory]
      operationId: yankMemoryPack
      summary: Withdraw a version, or bring it back (its publisher, hub admins)
      security: [{}, {user: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                yanked: { type: boolean, default: true }
                reason: { type: [string, "null"] }
      responses:
        "200": { $ref: "#/components/responses/PackAnswer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/installs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [memory]
      operationId: uninstallMemoryPack
      summary: Uninstall a pack, with its notes (its place's editors)
      security: [{}, {user: []}]
      responses:
        "200":
          description: Uninstalled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/installs/{id}/fork:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [memory]
      operationId: forkMemoryPack
      summary: "Make an installed pack's notes the place's own"
      security: [{}, {user: []}]
      responses:
        "200":
          description: Forked.
          content:
            application/json:
              schema:
                type: object
                required: [id, notes]
                properties:
                  id: { type: string }
                  notes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/agent:
    get:
      tags: [memory]
      operationId: getMemoryAgent
      summary: "An outside MCP server's view of one chat's memory: the prompt and the tools"
      description: |
        With an `X-Knowledge-Memory` token (memoryAccess in MCP_SERVERS), a server uses the
        user's memory in the chat the token was made for, through the same memory_* tools
        Claude has. Its changes always wait in the user's inbox (or go to a shared note's
        editors).
      security:
        - memory: []
      responses:
        "200":
          description: The memory section for the server's own model, and the tools.
          content:
            application/json:
              schema:
                type: object
                required: [prompt, tools]
                properties:
                  prompt: { type: string }
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, description, inputSchema]
                      properties:
                        name: { type: string }
                        description: { type: string }
                        inputSchema: { type: object, additionalProperties: true, description: A JSON Schema. }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/MemoryOffInChat" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

  /memory/agent/tools/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, enum: [memory_view, memory_search, memory_save, memory_edit, memory_delete] }
    post:
      tags: [memory]
      operationId: callMemoryTool
      summary: Call one memory tool for an outside MCP server
      security:
        - memory: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: "The tool's arguments, as its inputSchema says." }
      responses:
        "200":
          description: What the tool answered.
          content:
            application/json:
              schema:
                type: object
                required: [text, isError]
                properties:
                  text: { type: string }
                  isError: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignIn" }
        "403": { $ref: "#/components/responses/MemoryOffInChat" }
        "404": { $ref: "#/components/responses/MemoryNotFound" }
        "500": { $ref: "#/components/responses/StorageError" }
        "503": { $ref: "#/components/responses/Starting" }

components:
  securitySchemes:
    user:
      type: apiKey
      in: header
      name: X-Knowledge-User
      description: A signed identity token for the signed-in user, sent by the Next.js server when login is on.
    storage:
      type: apiKey
      in: header
      name: X-Knowledge-Storage
      description: "A storage token (aud \"storage\"): Claude acting for its user through an outside service, with the limits listed above."
    memory:
      type: apiKey
      in: header
      name: X-Knowledge-Memory
      description: "A memory token (aud \"memory\") for one chat run, for /memory/agent only: an outside MCP server using that chat's memory."

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: The file's path in its place, such as notes/plan.md; each segment URL-encoded, slashes kept.
      schema: { type: string }
      x-path-rest: true
    Node:
      name: node
      in: query
      description: A knowledge node's files; leave out both node and experiment for the workspace root.
      schema: { type: string }
    SkillName:
      name: name
      in: path
      required: true
      description: A skill's name (lowercase letters, digits and dashes).
      schema: { type: string }
    MemoryName:
      name: name
      in: path
      required: true
      description: "A note's or a pack's name: lowercase letters, digits and dashes (e.g. writing-style)."
      schema: { type: string }
    HubVersion:
      name: version
      in: query
      description: A version number; leave out for the newest.
      schema: { type: integer, minimum: 1 }
    Experiment:
      name: experiment
      in: query
      description: An experiment's files, instead of a node's.
      schema: { type: string }

  responses:
    MemoryNotFound:
      description: No such note (or proposal, pack, install), or memory is off on this server (MEMORY=on) or has no storage.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryChanged:
      description: The note changed since (or the name is in use, or the change was already undone).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryOffInChat:
      description: Memory is off in that chat (incognito, or turned off).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemoryNoteAnswer:
      description: The note now.
      content:
        application/json:
          schema:
            type: object
            required: [note]
            properties:
              note: { $ref: "#/components/schemas/MemoryNote" }
    PackAnswer:
      description: The pack, at that version.
      content:
        application/json:
          schema:
            type: object
            required: [pack]
            properties:
              pack: { $ref: "#/components/schemas/PackDetail" }
    Conflict:
      description: Something is in the way, such as a skill folder of that name.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is malformed or names something invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignIn:
      description: Nobody signed in, or the identity or storage token is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this (or a storage token may not).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, not visible to the user, or storage isn't configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Exists:
      description: A create-only write, or a rename, to a path that already has a file (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ExperimentExists:
      description: An experiment already has this id, even a deleted one (`exists` is true).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is over the size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageError:
      description: Storage failed (or failed to start).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Starting:
      description: Storage is still starting; try again shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeletedId:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: { type: string, description: The id. }
    CreatedId:
      description: Created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IdOnly" }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean, const: true }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        exists: { type: boolean, const: true, description: The path already has a file. }

    IdOnly:
      type: object
      required: [id]
      properties:
        id: { type: string }

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.

    AuthorType:
      type: string
      enum: [user, agent]

    FileKind:
      type: string
      enum: [note, skill, upload, artifact]
      description: From the path's top folder (packages/contracts/src/files.ts KIND_FOLDERS).

    Role:
      type: string
      enum: [viewer, editor, owner]

    RoleOrNull:
      oneOf:
        - $ref: "#/components/schemas/Role"
        - type: "null"

    FileInfo:
      type: object
      required: [path, kind, mime, size, sha256, updatedAt, author]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }

    FileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    FileVersion:
      type: object
      required: [id, sha256, size, mime, author, authorId, createdAt]
      properties:
        id: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/FileVersion" }

    FileEvent:
      type: object
      required: [op, node, path]
      properties:
        op: { type: string, enum: [write, delete] }
        node: { type: [string, "null"] }
        experiment: { type: [string, "null"] }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        author: { $ref: "#/components/schemas/AuthorType" }

    NodeEvent:
      type: object
      required: [op, change, id]
      properties:
        op: { type: string, const: node }
        change: { type: string, enum: [create, rename, delete] }
        id: { type: string }

    ExperimentEvent:
      type: object
      required: [op, change, id, node]
      properties:
        op: { type: string, const: experiment }
        change: { type: string, enum: [create, update, status, delete] }
        id: { type: string }
        node: { type: [string, "null"], description: null for an experiment at the workspace root. }

    ProposalEvent:
      type: object
      required: [op, change, id, node, path, author, authorId]
      properties:
        op: { type: string, const: proposal }
        change: { type: string, enum: [create, update, accepted, rejected, withdrawn] }
        id: { type: string }
        node: { type: [string, "null"] }
        path: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string }

    WorkspaceEvent:
      description: One change on the /files?watch stream.
      oneOf:
        - $ref: "#/components/schemas/FileEvent"
        - $ref: "#/components/schemas/NodeEvent"
        - $ref: "#/components/schemas/ExperimentEvent"
        - $ref: "#/components/schemas/ProposalEvent"

    NodeType:
      type: object
      required: [name, depth]
      properties:
        name: { type: string, description: "A level of the tree, such as tech (depth 1) or process (depth 4)." }
        depth: { type: integer, minimum: 1 }

    KnowledgeNode:
      type: object
      required: [id, parentId, type, depth, name, fileCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"] }
        type: { type: string }
        depth: { type: integer, minimum: 1 }
        name: { type: string }
        fileCount: { type: integer, minimum: 0, description: Live files attached directly to this node. }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    VisibleNode:
      allOf:
        - $ref: "#/components/schemas/KnowledgeNode"
        - type: object
          required: [role]
          properties:
            role:
              description: The user's role; null for a node shown only because something below it is visible (its fileCount is then 0).
              $ref: "#/components/schemas/RoleOrNull"

    Tree:
      type: object
      required: [types, rootRole, nodes]
      properties:
        types:
          type: array
          items: { $ref: "#/components/schemas/NodeType" }
        rootRole: { $ref: "#/components/schemas/RoleOrNull" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/VisibleNode" }

    ExperimentStatus:
      type: string
      enum: [draft, shared, archived]
      description: Who sees it. A draft only its author; shared or archived everyone who can view its node.

    ExperimentState:
      type: string
      enum: [ready, running, done, failed]
      description: How far a run got.

    ExperimentInput:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true }
        results: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state: { $ref: "#/components/schemas/ExperimentState" }

    Experiment:
      type: object
      required:
        [id, nodeId, authorId, authorName, title, hypothesis, params, results, status, state,
         forkedAt, updatedAt, fileCount, provenance, access, mine]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null at the workspace root. }
        authorId: { type: string }
        authorName: { type: [string, "null"] }
        title: { type: string }
        hypothesis: { type: string }
        params: { type: object, additionalProperties: true }
        results: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ExperimentStatus" }
        state: { $ref: "#/components/schemas/ExperimentState" }
        forkedAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        fileCount: { type: integer, minimum: 0 }
        provenance:
          description: Where a run came from; {} when nobody recorded it.
          type: object
          additionalProperties: true
        access:
          type: string
          enum: [writer, reader]
          description: "writer: its author, while it isn't archived. reader: may look."
        mine: { type: boolean, description: Whether the asking user is its author. }

    ExperimentUploadMeta:
      description: The `meta` part of an experiment upload, as JSON.
      allOf:
        - type: object
          required: [id, path, title]
          properties:
            id: { type: string, format: uuid, description: The new experiment's id. }
            path:
              description: A node name for every level, top level first; empty (or null) for `None`.
              oneOf:
                - { type: string, description: 'Names joined with "/", e.g. "Etch/Module 3//".' }
                - type: array
                  items: { type: [string, "null"] }
        - $ref: "#/components/schemas/ExperimentInput"

    ExperimentUpload:
      type: object
      required: [experiment, lineage, created, files]
      properties:
        experiment: { $ref: "#/components/schemas/Experiment" }
        lineage:
          description: The node it sits on and that node's ancestors, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        created:
          description: The nodes of the path that didn't exist and were added for it, top level first.
          type: array
          items: { $ref: "#/components/schemas/KnowledgeNode" }
        files:
          type: array
          items: { $ref: "#/components/schemas/FileInfo" }

    RunInputSource:
      type: object
      required: [path]
      properties:
        path: { type: string }
        node: { type: [string, "null"], description: Its knowledge node; null or left out for the workspace root. }
        experiment: { type: [string, "null"], description: Its experiment, instead of a node. }
        as: { type: string, description: Its name under inputs/; its own file name by default. }

    SearchHit:
      type: object
      required: [path, kind, mime, node, experiment, where, experimentTitle, snippet, match, updatedAt, author]
      properties:
        path: { type: string }
        kind: { $ref: "#/components/schemas/FileKind" }
        mime: { type: string }
        node: { type: [string, "null"], description: null at the root or in an experiment. }
        experiment: { type: [string, "null"] }
        where:
          description: Node names from the top down to the file's node.
          type: array
          items: { type: string }
        experimentTitle: { type: [string, "null"] }
        snippet: { type: string, description: The passage that matched; "" when only the path did. }
        match:
          type: string
          enum: [words, meaning]
          description: "words: its text or path has the words; meaning: only a passage close in meaning."
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        author: { $ref: "#/components/schemas/AuthorType" }

    ProposalStatus:
      type: string
      enum: [open, accepted, rejected, withdrawn]

    Proposal:
      type: object
      required:
        [id, node, path, sha256, size, mime, author, authorId, authorName, experiment, experimentTitle,
         note, status, decidedByName, decidedAt, createdAt, updatedAt, isNew, fileChanged, mine, canDecide]
      properties:
        id: { type: string }
        node: { type: [string, "null"], description: The node whose file it changes; null for the workspace root. }
        path: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        author: { $ref: "#/components/schemas/AuthorType" }
        authorId: { type: string, description: The user, or the user Claude was acting for. }
        authorName: { type: [string, "null"] }
        experiment: { type: [string, "null"], description: The experiment it was promoted from. }
        experimentTitle: { type: [string, "null"] }
        note: { type: string }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        decidedByName: { type: [string, "null"] }
        decidedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        isNew: { type: boolean, description: No live file at the path yet; accepting creates it. }
        fileChanged: { type: boolean, description: The file changed after this was proposed. }
        mine: { type: boolean, description: Whether the asking user proposed it (and may withdraw it). }
        canDecide: { type: boolean, description: Whether the asking user may accept or reject it. }

    ProposalList:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }

    Promotable:
      type: object
      required: [path, change, size, mime, proposal]
      properties:
        path: { type: string }
        change:
          type: string
          enum: [new, changed]
          description: "new: the node has no file there; changed: the node's differs."
        size: { type: integer, minimum: 0 }
        mime: { type: string }
        proposal: { type: [string, "null"], description: This experiment's open proposal with exactly these bytes. }

    ChatSummary:
      type: object
      required: [id, name, agentId, archived, createdAt, updatedAt, lastRunAt]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        agentId: { type: string }
        archived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastRunAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    ChatRun:
      type: object
      required: [runId, parentRunId, events, createdAt]
      properties:
        runId: { type: string }
        parentRunId: { type: [string, "null"] }
        events:
          description: The run's AG-UI events, compacted.
          type: array
          items: {}
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    User:
      type: object
      required: [id, subject, email, name]
      properties:
        id: { type: string }
        subject: { type: string }
        email: { type: [string, "null"] }
        name: { type: [string, "null"] }

    Person:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [createdAt, lastSeenAt, role, grantId, effectiveRole, groupIds]
          properties:
            createdAt: { $ref: "#/components/schemas/Timestamp" }
            lastSeenAt:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            role:
              description: Their own grant on the whole workspace, if any.
              $ref: "#/components/schemas/RoleOrNull"
            grantId: { type: [string, "null"] }
            effectiveRole:
              description: Their best workspace role, groups included.
              $ref: "#/components/schemas/RoleOrNull"
            groupIds:
              type: array
              items: { type: string }

    Group:
      type: object
      required: [id, parentId, name, memberIds]
      properties:
        id: { type: string }
        parentId: { type: [string, "null"] }
        name: { type: string }
        memberIds:
          description: Direct members; members of sub-groups are listed on those groups.
          type: array
          items: { type: string }

    Grant:
      type: object
      required: [id, nodeId, principalType, principalId, role, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: [string, "null"], description: null for the whole workspace. }
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    AuditEntry:
      type: object
      required: [id, actorType, actorId, action, target, at]
      properties:
        id: { type: string }
        actorType: { type: string, enum: [user, agent] }
        actorId: { type: [string, "null"] }
        action: { type: string, description: "Such as node.create, group.add_member or grant.set." }
        target: { type: object, additionalProperties: true }
        at: { $ref: "#/components/schemas/Timestamp" }

    # --- Server, tools and suggestions ---

    RunAgentInput:
      type: object
      description: An AG-UI run request (https://docs.ag-ui.com); only the fields /suggest reads are listed.
      additionalProperties: true
      required: [threadId, runId, messages]
      properties:
        threadId: { type: string }
        runId: { type: string }
        messages: { type: array, items: { type: object, additionalProperties: true } }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        context: { type: array, items: { type: object, additionalProperties: true } }

    AgUiEvent:
      type: object
      description: One AG-UI event (https://docs.ag-ui.com), by `type`.
      additionalProperties: true
      required: [type]
      properties:
        type: { type: string }

    ToolMenuItem:
      type: object
      required: [server, label, chip, description, icon, mode, callable]
      properties:
        server: { type: string, description: Its name in MCP_SERVERS. }
        label: { type: string }
        chip: { type: string, description: The chip's text in the composer. }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        mode: { type: string, enum: [auto, manual] }
        callable:
          type: array
          description: Tools the app may call with POST /tools/{server}/{tool}.
          items: { type: string }

    # --- Skills and the hub ---

    SkillMode:
      type: string
      enum: [auto, manual, off]
    SkillModeOrNull:
      oneOf:
        - $ref: "#/components/schemas/SkillMode"
        - type: "null"
    SkillSource:
      type: string
      enum: [builtin, workspace, hub]

    HubPin:
      type: object
      description: An installed hub skill's version, the newest one to update to, and their standing.
      required: [version, latest, verified, yanked, yankReason]
      properties:
        version: { type: integer }
        latest: { type: integer, description: The newest version that isn't yanked. }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }

    SkillInfo:
      type: object
      required: [name, description, argumentHint, source, path, modelInvocable, userInvocable, needsExecution,
                 mode, defaultMode, workspaceMode, userMode, chatMode, hub]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"], description: "Shown after /name in the slash menu, such as [file]." }
        source: { $ref: "#/components/schemas/SkillSource" }
        path: { type: [string, "null"], description: Its SKILL.md in the workspace; null for built-in skills. }
        modelInvocable: { type: boolean, description: "False when its front matter says disable-model-invocation: never auto." }
        userInvocable: { type: boolean, description: "False when its front matter says user-invocable: false: no /name." }
        needsExecution: { type: boolean, description: It ships scripts or asks for a shell. }
        mode: { $ref: "#/components/schemas/SkillMode" }
        defaultMode: { $ref: "#/components/schemas/SkillMode" }
        workspaceMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        userMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        chatMode: { $ref: "#/components/schemas/SkillModeOrNull" }
        hub:
          oneOf:
            - $ref: "#/components/schemas/HubPin"
            - type: "null"

    RunSkill:
      type: object
      required: [name, mode, source, userInvocable, needsExecution, files]
      properties:
        name: { type: string }
        mode: { type: string, enum: [auto, manual], description: "auto: Claude may use it and /name runs it; manual: only /name." }
        source: { $ref: "#/components/schemas/SkillSource" }
        userInvocable: { type: boolean, description: "False: no /name for it." }
        needsExecution: { type: boolean, description: "It ships scripts, which run only with SKILL_SCRIPTS=on on this server." }
        files:
          type: array
          items: { $ref: "#/components/schemas/RunSkillFile" }
    RunSkillFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Inside the skill's folder, e.g. SKILL.md." }
        content: { type: string, description: "The file's bytes in base64." }
    SkillList:
      type: object
      required: [skills, canSetDefaults, canPublish, hub, scripts]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillInfo" }
        canSetDefaults: { type: boolean, description: "Editor at the root: may set defaults and add skills." }
        canPublish: { type: boolean, description: Owner at the root. }
        hub: { type: boolean, description: There is a hub (it needs storage). }
        scripts: { type: boolean, description: "Skills' scripts run (SKILL_SCRIPTS=on)." }

    ScanFlag:
      type: object
      required: [kind, path, line, detail]
      properties:
        kind: { type: string, enum: [scripts, network, large, binary, hidden-text, instructions] }
        path: { type: string }
        line: { type: [integer, "null"] }
        detail: { type: string }

    HubListing:
      type: object
      required: [name, description, argumentHint, modelInvocable, userInvocable, needsExecution, publisher, mine,
                 latest, verified, yanked, flags, updatedAt, installed, reports]
      properties:
        name: { type: string }
        description: { type: string }
        argumentHint: { type: [string, "null"] }
        modelInvocable: { type: boolean }
        userInvocable: { type: boolean }
        needsExecution: { type: boolean }
        publisher: { type: [string, "null"], description: Who first published it. }
        mine: { type: boolean, description: You published it. }
        latest: { type: integer }
        verified: { type: boolean, description: About `latest`. }
        yanked: { type: boolean, description: About `latest`. }
        flags: { type: integer, description: "How many scan flags `latest` has." }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        installed: { type: [integer, "null"], description: The version installed in this workspace. }
        reports: { type: [integer, "null"], description: Open reports, for hub admins and the publisher. }

    HubVersion:
      type: object
      required: [version, publishedAt, publishedBy, files, size, needsExecution, verified, yanked, yankReason, flags]
      properties:
        version: { type: integer }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        publishedBy: { type: [string, "null"] }
        files: { type: integer }
        size: { type: integer }
        needsExecution: { type: boolean }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }
        flags:
          type: array
          items: { $ref: "#/components/schemas/ScanFlag" }

    HubReport:
      type: object
      required: [id, version, reason, reporter, createdAt]
      properties:
        id: { type: string }
        version: { type: [integer, "null"] }
        reason: { type: string }
        reporter: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    HubDetail:
      allOf:
        - $ref: "#/components/schemas/HubListing"
        - type: object
          required: [versions, version, skillMd, canModerate, canYank, openReports]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/HubVersion" }
            version: { type: integer, description: The version shown. }
            skillMd: { type: string, description: "That version's SKILL.md." }
            canModerate: { type: boolean, description: "A hub admin: may verify and dismiss reports." }
            canYank: { type: boolean }
            openReports:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/HubReport" }
                - type: "null"

    HubList:
      type: object
      required: [skills, canInstall, canPublish, isAdmin]
      properties:
        skills:
          type: array
          items: { $ref: "#/components/schemas/HubListing" }
        canInstall: { type: boolean }
        canPublish: { type: boolean }
        isAdmin: { type: boolean }

    HubDiffFile:
      type: object
      required: [path, change, before, after, binary]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before: { type: [string, "null"] }
        after: { type: [string, "null"] }
        binary: { type: boolean }

    HubDiff:
      type: object
      required: [name, from, to, files, flags]
      properties:
        name: { type: string }
        from: { type: integer }
        to: { type: integer }
        files:
          type: array
          items: { $ref: "#/components/schemas/HubDiffFile" }
        flags:
          type: array
          description: "What the scan found in `to`."
          items: { $ref: "#/components/schemas/ScanFlag" }

    # --- Memory ---

    MemoryType:
      type: string
      enum: [preference, profile, project, reference, feedback]
    MemoryMode:
      type: string
      enum: ["on", ask, "off"]
    MemoryAuthor:
      type: string
      enum: [user, agent]

    MemoryInput:
      type: object
      required: [description, type, body]
      properties:
        description: { type: string, description: One line; it goes in the index. }
        type: { type: string, description: "One of MemoryType." }
        body: { type: string, description: The note, in markdown. }

    MemorySummary:
      type: object
      required: [name, description, type, version, createdBy, updatedBy, archived, createdAt, updatedAt, lastUsedAt]
      properties:
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        version: { type: integer }
        createdBy: { $ref: "#/components/schemas/MemoryAuthor" }
        updatedBy: { $ref: "#/components/schemas/MemoryAuthor" }
        archived: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    MemoryNote:
      allOf:
        - $ref: "#/components/schemas/MemorySummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    MemoryVersion:
      type: object
      required: [version, description, type, body, changedBy, threadId, createdAt]
      properties:
        version: { type: integer }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }
        changedBy: { $ref: "#/components/schemas/MemoryAuthor" }
        threadId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MemoryEvent:
      type: object
      description: What Claude did with a note in a run, as the chat shows it.
      required: [id, name, description, kind, version]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [read, create, update, archive, propose] }
        version: { type: integer }
        shared:
          type: object
          description: For a shared note, which one and where it lives.
          required: [id, label]
          properties:
            id: { type: string }
            label: { type: string }

    MemoryActivity:
      allOf:
        - $ref: "#/components/schemas/MemoryEvent"
        - type: object
          required: [threadId, source, at, undone, undoable]
          properties:
            threadId: { type: string }
            source: { type: string, enum: [chat, learn, inbox] }
            at: { $ref: "#/components/schemas/Timestamp" }
            undone: { type: boolean }
            undoable: { type: boolean, description: "Still the note's latest change, so Undo can take it back." }

    InboxItem:
      type: object
      description: A change Claude proposed, waiting for the user.
      required: [id, op, name, description, type, body, baseVersion, source, threadId, reason, createdAt]
      properties:
        id: { type: string }
        op: { type: string, enum: [add, update, delete] }
        name: { type: string }
        description: { type: [string, "null"] }
        type:
          oneOf:
            - $ref: "#/components/schemas/MemoryType"
            - type: "null"
        body: { type: [string, "null"] }
        baseVersion: { type: [integer, "null"], description: "The note's version the change was made against." }
        source: { type: string, enum: [chat, learn, import] }
        threadId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MemorySettings:
      type: object
      required: [mode, incognito]
      properties:
        mode: { $ref: "#/components/schemas/MemoryMode" }
        incognito: { type: boolean }

    MemoryImport:
      type: object
      required: [proposed, skipped, how]
      properties:
        proposed: { type: integer, description: Notes now waiting in the inbox. }
        skipped: { type: integer, description: "Notes left out: invalid, or the inbox was full." }
        how:
          type: string
          enum: [files, text, whole]
          description: "files: front matter read as is; text: the model sorted plain text; whole: the model wasn't available, so the text is one note."

    SharedScope:
      type: string
      enum: [workspace, node, group]
    SharedMode:
      type: string
      enum: [auto, manual, "off"]

    SharedTarget:
      type: object
      description: "A place for shared memory: the workspace, a knowledge node (`nodeId`) or a group (`groupId`)."
      required: [scope]
      properties:
        scope: { $ref: "#/components/schemas/SharedScope" }
        nodeId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }

    SharedPlace:
      type: object
      required: [scope, nodeId, groupId, label]
      properties:
        scope: { $ref: "#/components/schemas/SharedScope" }
        nodeId: { type: [string, "null"] }
        groupId: { type: [string, "null"] }
        label: { type: string, description: "\"Workspace\", the node's or the group's name." }

    SharedSummary:
      type: object
      required: [id, name, description, type, version, place, canEdit, mode, myMode, everyoneMode, updatedAt, pack]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        version: { type: integer }
        place: { $ref: "#/components/schemas/SharedPlace" }
        canEdit: { type: boolean, description: "You can edit it, set it for everyone, and decide its proposals." }
        mode: { $ref: "#/components/schemas/SharedMode" }
        myMode:
          oneOf:
            - $ref: "#/components/schemas/SharedMode"
            - type: "null"
        everyoneMode: { $ref: "#/components/schemas/SharedMode" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        pack:
          description: Installed from a memory pack, read-only until the pack is forked.
          oneOf:
            - type: object
              required: [installId, name, version]
              properties:
                installId: { type: string }
                name: { type: string }
                version: { type: integer }
            - type: "null"

    SharedNote:
      allOf:
        - $ref: "#/components/schemas/SharedSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    SharedVersion:
      type: object
      required: [version, description, type, body, changedBy, changedAs, createdAt]
      properties:
        version: { type: integer }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }
        changedBy: { type: [string, "null"] }
        changedAs: { $ref: "#/components/schemas/MemoryAuthor" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    SharedProposal:
      type: object
      required: [id, op, place, memoryId, name, description, type, body, baseVersion, author, authorType, mine,
                 canDecide, threadId, reason, createdAt]
      properties:
        id: { type: string }
        op: { type: string, enum: [add, update, delete] }
        place: { $ref: "#/components/schemas/SharedPlace" }
        memoryId: { type: [string, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        type:
          oneOf:
            - $ref: "#/components/schemas/MemoryType"
            - type: "null"
        body: { type: [string, "null"] }
        baseVersion: { type: [integer, "null"] }
        author: { type: [string, "null"], description: "The person, or the person Claude was working for." }
        authorType: { $ref: "#/components/schemas/MemoryAuthor" }
        mine: { type: boolean }
        canDecide: { type: boolean }
        threadId: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    SharedTargetPlace:
      allOf:
        - $ref: "#/components/schemas/SharedPlace"
        - type: object
          required: [canEdit]
          properties:
            canEdit: { type: boolean }

    PackNote:
      type: object
      required: [name, description, type, body]
      properties:
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/MemoryType" }
        body: { type: string }

    PackVersion:
      type: object
      required: [version, description, notes, flags, publishedBy, publishedAt, verified, yanked, yankReason]
      properties:
        version: { type: integer }
        description: { type: string }
        notes: { type: integer }
        flags:
          type: array
          items: { $ref: "#/components/schemas/ScanFlag" }
        publishedBy: { type: [string, "null"] }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
        verified: { type: boolean }
        yanked: { type: boolean }
        yankReason: { type: [string, "null"] }

    PackListing:
      type: object
      required: [name, owner, mine, latest, updatedAt]
      properties:
        name: { type: string }
        owner: { type: [string, "null"] }
        mine: { type: boolean }
        latest:
          description: "The newest version that isn't yanked; null when all are."
          oneOf:
            - $ref: "#/components/schemas/PackVersion"
            - type: "null"
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    PackDetail:
      allOf:
        - $ref: "#/components/schemas/PackListing"
        - type: object
          required: [versions, version, notes, isAdmin]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/PackVersion" }
            version: { $ref: "#/components/schemas/PackVersion" }
            notes:
              type: array
              items: { $ref: "#/components/schemas/PackNote" }
            isAdmin: { type: boolean }

    PackInstall:
      type: object
      required: [id, name, version, latest, place, canEdit, notes, installedAt]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        latest: { type: [integer, "null"], description: "A newer version that isn't yanked, if any." }
        place: { $ref: "#/components/schemas/SharedPlace" }
        canEdit: { type: boolean }
        notes: { type: integer }
        installedAt: { $ref: "#/components/schemas/Timestamp" }

    MemoryOverview:
      allOf:
        - $ref: "#/components/schemas/MemorySettings"
        - type: object
          required: [notes, inbox, shared, sharedProposals, targets, installs, types, limits]
          properties:
            notes:
              type: array
              description: Your notes, archived ones last.
              items: { $ref: "#/components/schemas/MemorySummary" }
            inbox:
              type: array
              items: { $ref: "#/components/schemas/InboxItem" }
            shared:
              type: array
              items: { $ref: "#/components/schemas/SharedSummary" }
            sharedProposals:
              type: array
              description: Open proposals you decide or made.
              items: { $ref: "#/components/schemas/SharedProposal" }
            targets:
              type: array
              description: The places you can share to.
              items: { $ref: "#/components/schemas/SharedTargetPlace" }
            installs:
              type: array
              description: Packs installed in places you read.
              items: { $ref: "#/components/schemas/PackInstall" }
            types:
              type: array
              items: { $ref: "#/components/schemas/MemoryType" }
            limits:
              type: object
              required: [notes, body, description, index]
              properties:
                notes: { type: integer }
                body: { type: integer }
                description: { type: integer }
                index: { type: integer }

    DeletedFlag:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string }
        deleted: { type: boolean, const: true }
