# The Python side of the monorepo: one uv workspace with one uv.lock (issue #164).
# The TypeScript side is the pnpm workspace (pnpm-workspace.yaml).
#
#   uv sync --all-packages                 # every service and package, with dev tools
#   uv run --package papers-mcp pytest services/papers-mcp
#
# A new Python service goes in services/<name>/ with its own pyproject.toml.
[tool.uv.workspace]
members = ["services/*", "packages/knowledge-py"]

[dependency-groups]
dev = ["ruff==0.17.4", "pyrefly==1.4.1", "coverage==7.17.2"]
security = ["pip-audit==2.10.1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/knowledge-py/src/knowledge_chatroom/api.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_chatroom", "agent_py", "api_py", "lab_tools", "papers_mcp"]

[tool.pyrefly]
python-version = "3.12"
project-includes = [
    "packages/knowledge-py/src",
    "examples/python-agent/before",
    "services/agent-py/agent_py",
    "services/api-py/api_py",
    "services/lab-tools/lab_tools",
    "services/papers-mcp/papers_mcp",
]
project-excludes = ["packages/knowledge-py/src/knowledge_chatroom/api.py"]
search-path = [
    "packages/knowledge-py/src",
    "services/agent-py",
    "services/api-py",
    "services/lab-tools",
    "services/papers-mcp",
]
baseline = "pyrefly-baseline.json"
baseline-matching-mode = "column-ordered"
type-ignore-unknown-tag-behavior = "no-effect"

[tool.coverage.run]
source = [
    "packages/knowledge-py/src/knowledge_chatroom",
    "services/agent-py/agent_py",
    "services/api-py/api_py",
    "services/lab-tools/lab_tools",
    "services/papers-mcp/papers_mcp",
]
omit = ["*/knowledge_chatroom/api.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
